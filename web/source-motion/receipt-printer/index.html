<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Принтер чека</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../common.css">
</head>
<body>
  <main class="scene">
    <section class="printer" aria-label="Принтер чека" aria-busy="false" data-stage="ready">
      <div class="machine">
        <header>
          <span class="logo" aria-hidden="true">◆</span>
          <span class="kiosk">Касса 01</span>
        </header>
        <div class="screen">
          <div class="order">
            <span>
              <strong>План Pro</strong>
              <small>Годовая подписка</small>
            </span>
            <b>23 040 ₽</b>
          </div>
          <div class="status" aria-live="polite">
            <i aria-hidden="true"></i>
            <span>Готов к печати</span>
          </div>
        </div>
        <div class="progress" aria-hidden="true"><span></span></div>
        <div class="slot" aria-hidden="true"></div>
      </div>

      <div class="output" aria-live="polite">
        <article class="receipt" aria-hidden="true">
          <p class="receipt-brand">ECLIPSE / ORDER</p>
          <h1>Чек</h1>
          <hr>
          <dl>
            <div><dt>План Pro</dt><dd>19 200 ₽</dd></div>
            <div><dt>НДС</dt><dd>3 840 ₽</dd></div>
          </dl>
          <hr>
          <div class="total"><span>Оплачено</span><strong>23 040 ₽</strong></div>
          <p class="thanks">Спасибо за заказ.</p>
          <div class="barcode" aria-hidden="true"></div>
          <small>№ EF-0826-024</small>
        </article>
      </div>
    </section>

    <div class="controls">
      <button id="start" type="button">Распечатать чек</button>
      <button id="reset" type="button" disabled>Сбросить</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
