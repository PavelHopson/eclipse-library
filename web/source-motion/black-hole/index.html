<!DOCTYPE html>
<html lang="ru">

  <head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симуляция чёрной дыры</title>
    <link rel="stylesheet" href="./style.css">

    <link rel="stylesheet" href="../common.css">
</head>

  <body>
  <div id="info">
    Галактическая чёрная дыра<br>
    <span style="font-size: 14px; opacity: 0.8;">Нажмите на ядро или кнопку, чтобы запустить импульс. Потяните мышью для вращения.</span>
  </div>

  <div id="controls" class="ui-panel" aria-label="Управление сценой">
    <button id="autoRotateToggle" class="control-item" type="button" aria-pressed="true">Автовращение: включено</button>
    <button id="triggerEffectButton" class="control-item" type="button">Запустить импульс</button>
  </div>

  <div id="theme-changer" class="ui-panel">
    <h4>Цветовая тема</h4>
    <div id="theme-buttons">
      <button type="button" class="theme-button active" data-theme="inferno">Инферно</button>
      <button type="button" class="theme-button" data-theme="ruby">Рубин</button>
      <button type="button" class="theme-button" data-theme="plasma">Плазма</button>
      <button type="button" class="theme-button" data-theme="void">Бездна</button>
    </div>
  </div>
<script src="./script.local.js"></script>
  </body>

</html>
