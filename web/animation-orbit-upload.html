<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Upload — Eclipse Motion</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0c2030,#060910 60%);font-family:system-ui;color:white}.wrap{display:grid;justify-items:center;gap:17px}.orbit{position:relative;width:190px;height:190px;display:grid;place-items:center}.orbit svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.track{fill:none;stroke:#182839;stroke-width:3}.value{fill:none;stroke:url(#g);stroke-width:4;stroke-linecap:round;stroke-dasharray:565;stroke-dashoffset:565}.arrow{font-size:42px;color:#63efff;filter:drop-shadow(0 0 12px #3cdfff88);transform:translateY(8px);opacity:.45}.percent{position:absolute;bottom:44px;color:#a6b8c9;font:600 12px ui-monospace,monospace}.file{font:600 11px ui-monospace,monospace;color:#73879a}.cancel{padding:8px 15px;border:1px solid #26384b;border-radius:999px;background:transparent;color:#98aabb;font:700 9px system-ui;letter-spacing:.16em}.run .value{animation:fill 2.6s cubic-bezier(.22,.8,.35,1) forwards}.run .arrow{animation:lift 2.6s cubic-bezier(.22,.8,.35,1) forwards}@keyframes fill{to{stroke-dashoffset:0}}@keyframes lift{40%{opacity:1;transform:translateY(-5px)}to{opacity:1;transform:translateY(-25px)}}@media(prefers-reduced-motion:reduce){.run .value,.run .arrow{animation:none}.run .value{stroke-dashoffset:170}.run .arrow{opacity:1;transform:none}}
</style></head><body><main class="wrap run" aria-label="Прогресс загрузки"><div class="orbit"><svg viewBox="0 0 190 190" aria-hidden="true"><defs><linearGradient id="g"><stop stop-color="#64f2ff"/><stop offset="1" stop-color="#8f72ff"/></linearGradient></defs><circle class="track" cx="95" cy="95" r="90"/><circle class="value" cx="95" cy="95" r="90"/></svg><span class="arrow" aria-hidden="true">↑</span><span class="percent" aria-live="polite">0%</span></div><div class="file">eclipse-motion-kit.zip · 14 MB</div><button class="cancel" type="button">ОТМЕНИТЬ</button></main><script>
const p=new URLSearchParams(location.search),reduced=p.get('reduce')==='1'||matchMedia('(prefers-reduced-motion: reduce)').matches,frozen=Number(p.get('t')),circle=document.querySelector('.value'),label=document.querySelector('.percent'),root=document.querySelector('.wrap');function set(v){label.textContent=`${Math.round(v)}%`;circle.style.strokeDashoffset=565*(1-v/100)}if(Number.isFinite(frozen)){root.classList.remove('run');set(Math.min(100,frozen/26*100))}else if(reduced){root.classList.remove('run');set(70)}else{const start=performance.now();function frame(now){const v=Math.min(100,(now-start)/2600*100);label.textContent=v<100?`${Math.round(v)}%`:'Готово';if(v<100)requestAnimationFrame(frame)}requestAnimationFrame(frame)}document.querySelector('.cancel').onclick=()=>{root.classList.remove('run');set(0);label.textContent='Отменено'};
</script></body></html>
