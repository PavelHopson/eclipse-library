<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vault Dial</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 20%,#182437,transparent 46%),#05080c;color:#edf4ff;font-family:Inter,system-ui}.panel{width:min(88vw,430px);padding:25px;border:1px solid #2a3749;border-radius:24px;background:#0a1018;box-shadow:0 30px 90px #0009}.top{display:flex;align-items:center;justify-content:space-between;color:#6c7a8d;font:9px ui-monospace,monospace;letter-spacing:.14em}.led{width:7px;height:7px;border-radius:50%;background:#ffb64d;box-shadow:0 0 10px #ff9d32}.safe{position:relative;height:280px;margin:18px 0;border:1px solid #334155;border-radius:20px;background:linear-gradient(145deg,#172131,#0b1018);box-shadow:inset 0 0 40px #0008;overflow:hidden}.door{position:absolute;inset:10px;border:1px solid #3b4b60;border-radius:15px;transition:transform .7s cubic-bezier(.2,.8,.2,1),box-shadow .7s;transform-origin:left}.safe.open .door{transform:perspective(700px) rotateY(-28deg);box-shadow:25px 8px 40px #000}.dial{position:absolute;left:50%;top:50%;width:128px;height:128px;transform:translate(-50%,-50%) rotate(var(--r,0deg));border:8px double #52627a;border-radius:50%;background:repeating-conic-gradient(#202d3e 0 4deg,#111923 4deg 12deg);box-shadow:0 0 0 9px #0c121b,0 15px 35px #0008;cursor:pointer;transition:transform .7s cubic-bezier(.2,.8,.2,1)}.dial::before{content:"";position:absolute;inset:32px;border:1px solid #71819a;border-radius:50%;background:radial-gradient(circle at 35% 30%,#64758f,#182231 55%,#080d14)}.dial::after{content:"";position:absolute;left:50%;top:-15px;width:3px;height:23px;border-radius:3px;background:#6ba3ff;box-shadow:0 0 10px #6ba3ff}.bolts{position:absolute;inset:0}.bolts i{position:absolute;width:10px;height:10px;border-radius:50%;background:#4a5a70;box-shadow:inset 1px 1px #8090a5}.bolts i:nth-child(1){left:16px;top:16px}.bolts i:nth-child(2){right:16px;top:16px}.bolts i:nth-child(3){left:16px;bottom:16px}.bolts i:nth-child(4){right:16px;bottom:16px}.code{display:flex;gap:9px}.code input{flex:1;min-width:0;height:43px;padding:0 12px;border:1px solid #2c3a4c;border-radius:10px;background:#0d141e;color:white;font:12px ui-monospace,monospace;outline:0}.code input:focus{border-color:#6ba3ff}.unlock{min-width:104px;border:1px solid #46698f;border-radius:10px;background:#15283e;color:#dcecff;font-weight:700;cursor:pointer}.hint{min-height:15px;margin:10px 0 0;color:#65758a;font-size:9px}.safe.open+.code+.hint{color:#59dfa6}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style><body><main class="panel"><div class="top"><span>VAULT / ECLIPSE ID</span><i class="led"></i></div><section class="safe"><div class="door"><div class="bolts"><i></i><i></i><i></i><i></i></div><button class="dial" type="button" aria-label="Повернуть кодовый диск"></button></div></section><div class="code"><input value="204815" inputmode="numeric" aria-label="Код хранилища"><button class="unlock">UNLOCK</button></div><p class="hint">Поверните dial или подтвердите код</p></main><script>
const safe=document.querySelector(".safe"),dial=document.querySelector(".dial"),hint=document.querySelector(".hint"),q=new URLSearchParams(location.search),reduce=q.get("reduce")==="1"||matchMedia("(prefers-reduced-motion: reduce)").matches,raw=q.get("t"),frozen=raw===null?null:Number(raw);let turns=0;
function rotate(){turns+=reduce?90:150;dial.style.setProperty("--r",turns+"deg");hint.textContent="Механизм проверяет комбинацию…"}
function open(){rotate();setTimeout(()=>{safe.classList.toggle("open");const on=safe.classList.contains("open");hint.textContent=on?"Хранилище открыто":"Хранилище закрыто";document.querySelector(".led").style.background=on?"#59dfa6":"#ffb64d"},reduce?0:500)}
dial.onclick=open;document.querySelector(".unlock").onclick=open;if(frozen!==null&&Number.isFinite(frozen)&&frozen>10)open();else if(!reduce){setTimeout(rotate,650);setTimeout(rotate,1700)}
</script></body></html>
