<style>
:root{color-scheme:dark;--accent:#6ba3ff;--success:#59dfa6;--danger:#ff7f8d;--amber:#ffb657;--glow:.55;--speed:1;--rx:0deg;--ry:0deg;--dial:0deg;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}html,body{min-width:320px;min-height:100%}body{margin:0;min-height:100dvh;display:grid;place-items:center;overflow:hidden;padding:clamp(10px,3vmin,24px);background:#05080d;color:#edf5ff;font-family:Inter,"Segoe UI",sans-serif}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 78%,white);outline-offset:3px}
.scene{position:relative;width:min(100%,510px);max-height:100%;perspective:1200px;perspective-origin:50% 45%}.scene-glow{position:absolute;z-index:-1;inset:14% 5% 2%;border-radius:50%;background:color-mix(in srgb,var(--accent) 20%,transparent);filter:blur(70px);opacity:calc(var(--glow)*.5);transform:translateZ(-80px) scale(.86)}

.vault-header{position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:16px;transform:translateZ(25px)}.identity{display:grid;gap:4px}.identity span{color:#83a2c8;font:700 9px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}.identity strong{color:#dce9f9;font:600 12px Inter}.status{display:flex;align-items:center;gap:8px;color:#7b899b;font:700 8px ui-monospace,monospace;text-transform:uppercase}.status-light{position:relative;width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 14px var(--amber)}.status-light::after{content:"";position:absolute;inset:-8px;border:1px solid color-mix(in srgb,var(--amber) 32%,transparent);border-radius:50%;animation:signal calc(2.2s/var(--speed)) ease-out infinite}@keyframes signal{0%{transform:scale(.35);opacity:.8}75%,100%{transform:scale(1);opacity:0}}
.chamber{position:relative;height:clamp(238px,calc(100dvh - 250px),350px);margin:clamp(12px,2.5vh,20px) 0 clamp(12px,2vh,18px);border:1px solid rgba(127,154,190,.34);border-radius:23px;background:#070b11;box-shadow:inset 0 0 0 10px #0b111a,inset 0 0 0 11px rgba(127,154,190,.22),inset 0 32px 70px #000b;transform-style:preserve-3d;transform:translateZ(12px)}.chamber-depth{position:absolute;inset:23px;border-radius:14px;background:radial-gradient(circle at 50% 47%,#182436,#090e16 45%,#030508);box-shadow:inset 0 0 55px #000}.core-glow{position:absolute;left:50%;top:50%;width:190px;height:190px;margin:-95px;border-radius:50%;background:color-mix(in srgb,var(--accent) 20%,transparent);filter:blur(34px);opacity:calc(var(--glow)*.28);transform:translateZ(-5px) scale(.8);transition:opacity 300ms,transform 700ms var(--ease)}.vault[data-state=checking] .core-glow,.vault[data-state=open] .core-glow{opacity:calc(var(--glow)*.75);transform:translateZ(-5px) scale(1.2)}
.door{position:absolute;inset:11px;border:1px solid rgba(116,143,179,.45);border-radius:17px;background:linear-gradient(145deg,#172334,#0c131d 58%,#091019);box-shadow:inset 0 0 0 1px #ffffff06,inset 8px 10px 28px #ffffff06,inset -14px -18px 35px #0006,0 18px 34px #0005;transform-style:preserve-3d;transform-origin:4% 50%;transform:translateZ(18px) rotateY(0);transition:transform calc(900ms/var(--speed)) var(--ease),opacity 240ms}.vault[data-state=open] .door{transform:translateZ(18px) rotateY(-72deg)}
.door-sheen{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}.door-sheen::before{content:"";position:absolute;inset:-40% -90%;background:linear-gradient(105deg,transparent 42%,#ffffff17 49%,transparent 56%);transform:translateX(-25%);animation:sheen calc(5.5s/var(--speed)) ease-in-out infinite}@keyframes sheen{0%,30%{transform:translateX(-25%)}70%,100%{transform:translateX(25%)}}
.hinge{position:absolute;left:-8px;width:17px;height:55px;border:1px solid #3b4a60;border-radius:7px;background:linear-gradient(90deg,#090e15,#28364a 48%,#0b1119);box-shadow:4px 8px 16px #0008;transform:translateZ(10px)}.hinge:first-of-type{top:42px}.hinge:nth-of-type(2){bottom:42px}.bolts{position:absolute;inset:0;pointer-events:none}.bolt{position:absolute;width:11px;height:11px;border:1px solid #71839a;border-radius:50%;background:radial-gradient(circle at 34% 29%,#91a5bf,#45556b 42%,#1a2431 70%);box-shadow:0 4px 7px #0008}.bolt:nth-child(1){left:18px;top:18px}.bolt:nth-child(2){right:18px;top:18px}.bolt:nth-child(3){left:18px;bottom:18px}.bolt:nth-child(4){right:18px;bottom:18px}
.lock-stage{position:absolute;left:50%;top:50%;width:190px;height:190px;transform:translate(-50%,-50%) translateZ(36px);transform-style:preserve-3d}.lock-stage::before,.lock-stage::after{content:"";position:absolute;border:1px solid rgba(107,163,255,.2);border-radius:50%;pointer-events:none;opacity:0;transform:scale(.75);transition:opacity 240ms,transform 650ms var(--ease)}.lock-stage::before{inset:-15px}.lock-stage::after{inset:-33px;transition-delay:100ms}.vault[data-state=checking] .lock-stage::before,.vault[data-state=checking] .lock-stage::after{opacity:1;transform:scale(1)}
.dial{position:absolute;inset:0;margin:auto;width:170px;height:170px;padding:0;border:0;border-radius:50%;background:transparent;color:inherit;cursor:grab;touch-action:none;transform-style:preserve-3d;transform:rotate(var(--dial)) translateZ(18px);transition:transform calc(760ms/var(--speed)) cubic-bezier(.16,.78,.18,1)}.dial:active{cursor:grabbing}.dial-rim{position:absolute;inset:0;border:1px solid #62748c;border-radius:50%;background:repeating-conic-gradient(from 1deg,#8092aa 0 1deg,#243247 1deg 3deg,#101824 3deg 7deg);box-shadow:0 0 0 7px #0a1018,0 0 0 8px #3b4b61,0 22px 32px #000b,inset 0 0 20px #000;transform:translateZ(2px)}.dial-rim::after{content:"";position:absolute;inset:13px;border:1px solid #4f6078;border-radius:50%;background:radial-gradient(circle at 38% 30%,#ffffff1f,transparent 24%),conic-gradient(from 20deg,#111a27,#29384c,#101824,#1d2a3c,#111a27);box-shadow:inset 0 0 22px #0009}.dial-face{position:absolute;inset:45px;border:1px solid #8191a8;border-radius:50%;background:radial-gradient(circle at 34% 28%,#7c8da5,#34445a 26%,#131d2a 58%,#070b11);box-shadow:0 9px 17px #000b,inset 0 1px 2px #ffffff40;transform:translateZ(18px)}.dial-face::after{content:"";position:absolute;inset:13px;border:1px solid #ffffff1f;border-radius:50%}.dial-marker{position:absolute;left:50%;top:-3px;width:5px;height:34px;margin-left:-2.5px;border-radius:4px;background:linear-gradient(#b8d4ff,var(--accent));box-shadow:0 0 15px var(--accent);transform:translateZ(10px)}.dial-grip{position:absolute;left:50%;top:50%;width:84px;height:10px;margin:-5px 0 0 -42px;border:1px solid #ffffff1f;border-radius:99px;background:linear-gradient(#3a4a60,#111925);box-shadow:0 6px 12px #0008;transform:translateZ(28px)}.dial-grip::after{content:"";position:absolute;inset:2px 12px;border-radius:inherit;background:#ffffff0f}.lock-label{position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);color:#65758a;font:700 7px ui-monospace,monospace;letter-spacing:.16em;white-space:nowrap;text-transform:uppercase}
.pin{position:absolute;right:-10px;width:25px;height:9px;border:1px solid #53657d;border-radius:4px;background:linear-gradient(#7c8ea7,#28374a 45%,#101722);box-shadow:3px 4px 8px #0008;transition:transform calc(420ms/var(--speed)) var(--ease)}.pin:nth-of-type(3){top:76px}.pin:nth-of-type(4){top:50%;margin-top:-4px}.pin:nth-of-type(5){bottom:76px}.vault[data-state=open] .pin{transform:translateX(-25px)}
.controls{position:relative;z-index:4;display:grid;grid-template-columns:minmax(0,1fr) 116px;gap:10px;transform:translateZ(28px)}.controls>*{min-width:0}.code-field{position:relative}.code-field input{width:100%;height:48px;padding:0 44px 0 14px;border:1px solid #304157;border-radius:11px;background:#0b121c;color:white;font:700 12px ui-monospace,monospace;letter-spacing:.08em;outline:0;transition:border-color 160ms,background-color 160ms}.code-field input:focus{border-color:color-mix(in srgb,var(--accent) 72%,white);background:#0e1723}.code-field span{position:absolute;right:13px;top:50%;width:8px;height:8px;border-radius:50%;background:#435166;transform:translateY(-50%);transition:background-color 180ms,box-shadow 180ms}.vault[data-state=checking] .code-field span{background:var(--accent);box-shadow:0 0 12px var(--accent)}.vault[data-state=open] .code-field span{background:var(--success);box-shadow:0 0 12px var(--success)}
.unlock{height:48px;border:1px solid color-mix(in srgb,var(--accent) 55%,#304157);border-radius:11px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 25%,#142239),#102033);color:#e8f2ff;font:800 11px ui-monospace,monospace;letter-spacing:.06em;cursor:pointer;box-shadow:inset 0 1px #ffffff14,0 9px 24px #0004;transition:transform 150ms,border-color 160ms}.unlock:hover{border-color:color-mix(in srgb,var(--accent) 82%,white);transform:translateY(-1px)}.unlock:active{transform:translateY(1px)}.unlock:disabled{cursor:wait;opacity:.7;transform:none}
.feedback{position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:18px;margin:10px 1px 0;color:#65758a;font-size:9px;transform:translateZ(24px)}.feedback span:last-child{font:700 7px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}.vault[data-state=error]{animation:reject calc(420ms/var(--speed)) ease}.vault[data-state=error] .feedback{color:var(--danger)}.vault[data-state=open] .feedback{color:var(--success)}@keyframes reject{20%{transform:rotateX(var(--rx)) rotateY(var(--ry)) translateX(-7px)}40%{transform:rotateX(var(--rx)) rotateY(var(--ry)) translateX(6px)}65%{transform:rotateX(var(--rx)) rotateY(var(--ry)) translateX(-3px)}}html.high-contrast .vault{border-color:#89b9ff}html.high-contrast .identity span,html.high-contrast .feedback{color:#c5d8f2}
@media(max-width:520px){body{padding:10px}.scene{width:100%}.vault{padding:17px;border-radius:23px}.vault::after{display:none}.identity strong{display:none}.status span{display:none}.chamber{height:clamp(220px,calc(100dvh - 255px),310px);margin-top:14px}.controls{grid-template-columns:1fr}.feedback{align-items:flex-start}.feedback span:last-child{display:none}}
@media(prefers-reduced-motion:reduce){.vault{transform:none!important;transition:none}.scene-glow{display:none}.status-light::after,.door-sheen::before{animation:none}.core-glow,.door,.lock-stage::before,.lock-stage::after,.dial,.pin{transition-duration:120ms}.vault[data-state=open] .door{transform:translateZ(18px);opacity:.16}.vault[data-state=error]{animation:none}}

<script>(()=>{const q=new URLSearchParams(location.search),r=document.documentElement,a=q.get("accent");if(a&&/^#[0-9a-f]{6}$/i.test(a))r.style.setProperty("--accent",a);for(const k of ["glow","speed"]){const v=Number(q.get(k));if(Number.isFinite(v)&&v>0)r.style.setProperty("--"+k,String(v))}if(q.get("contrast")==="1")r.classList.add("high-contrast")})()</script>
<main class="scene" aria-labelledby="vault-title"><div class="scene-glow" aria-hidden="true"></div><section class="vault" data-state="idle">
<header class="vault-header"><div class="identity"><span>Vault / Eclipse ID</span><strong id="vault-title">Контур защищённого доступа</strong></div><div class="status" aria-live="polite"><i class="status-light" aria-hidden="true"></i><span>Standby</span></div></header>
<div class="chamber"><div class="chamber-depth"></div><div class="core-glow"></div><div class="door"><i class="hinge"></i><i class="hinge"></i><div class="door-sheen"></div><div class="bolts"><i class="bolt"></i><i class="bolt"></i><i class="bolt"></i><i class="bolt"></i></div><i class="pin"></i><i class="pin"></i><i class="pin"></i><div class="lock-stage"><button class="dial" type="button" aria-label="Кодовый диск. Поверните стрелками или перетаскиванием"><span class="dial-rim"></span><span class="dial-face"></span><span class="dial-marker"></span><span class="dial-grip"></span></button><span class="lock-label">Drag / wheel / arrows</span></div></div></div>
<div class="controls"><label class="code-field"><span aria-hidden="true"></span><input value="204815" maxlength="6" inputmode="numeric" autocomplete="one-time-code" aria-label="Шестизначный код хранилища"></label><button class="unlock" type="button">Unlock</button></div>
<p class="feedback" aria-live="polite"><span>Поверните диск или подтвердите код</span><span>Local demo</span></p>
</section></main>
<script>
const q=new URLSearchParams(location.search),vault=document.querySelector(".vault"),scene=document.querySelector(".scene"),dial=document.querySelector(".dial"),input=document.querySelector("input"),unlock=document.querySelector(".unlock"),feedback=document.querySelector(".feedback span"),statusText=document.querySelector(".status span"),statusLight=document.querySelector(".status-light"),reduce=q.get("reduce")==="1"||matchMedia("(prefers-reduced-motion: reduce)").matches,raw=q.get("t"),frozen=raw===null?null:Number(raw);let angle=0,dragging=false,lastPointerAngle=0,sequence=0,tiltFrame=0;
const messages={idle:"Поверните диск или подтвердите код",checking:"Проверяем локальную комбинацию…",error:"Код не совпал. Попробуйте ещё раз",open:"Доступ подтверждён. Хранилище открыто"};
function setAngle(next,instant=false){angle=next;dial.style.transitionDuration=instant?"0ms":"";dial.style.setProperty("--dial",angle+"deg");if(instant)requestAnimationFrame(()=>dial.style.transitionDuration="")}
function setState(state){vault.dataset.state=state;feedback.textContent=messages[state];statusText.textContent=state==="open"?"Unlocked":state==="checking"?"Verifying":state==="error"?"Rejected":"Standby";const color=state==="open"?"var(--success)":state==="error"?"var(--danger)":state==="checking"?"var(--accent)":"var(--amber)";statusLight.style.background=color;statusLight.style.boxShadow="0 0 14px "+color}
function pulseDial(amount=150){setAngle(angle+(reduce?45:amount))}
function verify(){const run=++sequence;setState("checking");unlock.disabled=true;pulseDial(220);setTimeout(()=>{if(run!==sequence)return;const valid=input.value==="204815";setState(valid?"open":"error");unlock.disabled=false;unlock.textContent=valid?"Lock":"Retry";if(valid)pulseDial(160)},reduce?20:720)}
function reset(){sequence++;setState("idle");unlock.disabled=false;unlock.textContent="Unlock"}
unlock.addEventListener("click",()=>vault.dataset.state==="open"?(reset(),pulseDial(80)):verify());input.addEventListener("input",()=>{input.value=input.value.replace(/\D/g,"").slice(0,6);if(vault.dataset.state!=="idle")reset()});input.addEventListener("keydown",e=>{if(e.key==="Enter")verify()});
dial.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowUp"){e.preventDefault();pulseDial(18)}else if(e.key==="ArrowLeft"||e.key==="ArrowDown"){e.preventDefault();pulseDial(-18)}else if(e.key==="Enter"||e.key===" "){e.preventDefault();verify()}});dial.addEventListener("wheel",e=>{e.preventDefault();pulseDial(e.deltaY>0?18:-18)},{passive:false});
function pointerAngle(e){const b=dial.getBoundingClientRect();return Math.atan2(e.clientY-(b.top+b.height/2),e.clientX-(b.left+b.width/2))*180/Math.PI}
dial.addEventListener("pointerdown",e=>{dragging=true;lastPointerAngle=pointerAngle(e);dial.setPointerCapture(e.pointerId);dial.style.transitionDuration="0ms"});dial.addEventListener("pointermove",e=>{if(!dragging)return;const next=pointerAngle(e),delta=((next-lastPointerAngle+540)%360)-180;setAngle(angle+delta,true);lastPointerAngle=next});dial.addEventListener("pointerup",e=>{dragging=false;dial.releasePointerCapture(e.pointerId);dial.style.transitionDuration="";if(Math.abs(angle)>45)setState("checking")});dial.addEventListener("pointercancel",()=>{dragging=false;dial.style.transitionDuration=""});
if(!reduce){scene.addEventListener("pointermove",e=>{if(e.pointerType==="touch")return;const b=scene.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;cancelAnimationFrame(tiltFrame);tiltFrame=requestAnimationFrame(()=>{vault.style.setProperty("--ry",(x*5).toFixed(2)+"deg");vault.style.setProperty("--rx",(-y*4).toFixed(2)+"deg")})});scene.addEventListener("pointerleave",()=>{vault.style.setProperty("--ry","0deg");vault.style.setProperty("--rx","0deg")})}
const initial=q.get("state")||"idle";if(initial==="complete")setState("open");else if(initial==="checking")setState("checking");else if(initial==="error")setState("error");else setState("idle");if(frozen!==null&&Number.isFinite(frozen)){setAngle(Math.max(0,frozen)*48,true);if(frozen>=3)setState("open");else if(frozen>=1)setState("checking")}else if(initial==="live"&&!reduce){setTimeout(()=>pulseDial(72),520);setTimeout(()=>pulseDial(-36),1450)}window.__ready=true;
</script>
