<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vault Dial — Eclipse Motion</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 22%,#232a38,#090b10 58%);font:13px system-ui;color:#edf1f8}.vault{width:min(410px,100%);padding:25px;border:1px solid #363c49;border-radius:25px;background:linear-gradient(145deg,#242a34,#11151c);box-shadow:inset 0 1px #ffffff16,0 30px 90px #000b}.top{display:flex;justify-content:space-between;align-items:center;color:#aab2c0;font:700 10px ui-monospace,monospace;letter-spacing:.12em}.lamp{width:9px;height:9px;border-radius:50%;background:#697384;box-shadow:0 0 0 4px #ffffff08}.body{display:grid;grid-template-columns:1fr 150px;gap:22px;align-items:center;margin-top:24px}.code{display:grid;gap:9px}.code label{color:#8791a1;font-size:10px}.code input{width:100%;padding:13px;border:1px solid #3c4655;border-radius:11px;background:#151920;color:white;font:700 16px ui-monospace,monospace;letter-spacing:.3em;outline:0}.code input:focus{border-color:#9b8dff;box-shadow:0 0 0 3px #8776ff19}.unlock{padding:11px;border:1px solid #4a5260;border-radius:10px;background:linear-gradient(#353d49,#252b34);color:white;font-weight:800;cursor:pointer}.dial{position:relative;width:150px;height:150px;border:1px solid #4d5663;border-radius:50%;background:repeating-conic-gradient(from -2deg,#222831 0 2deg,#515967 2deg 3deg,#222831 3deg 12deg);box-shadow:inset 0 0 0 18px #171b22,inset 0 0 30px #000,0 8px 20px #0008;touch-action:none}.dial::before{content:"";position:absolute;inset:35px;border:1px solid #616b79;border-radius:50%;background:radial-gradient(circle at 40% 35%,#697586,#202630 45%,#11151b 72%)}.dial::after{content:"";position:absolute;left:72px;top:8px;width:5px;height:28px;border-radius:5px;background:#b6aaff;box-shadow:0 0 12px #9e8eff}.teeth{display:flex;justify-content:space-between;margin-top:22px}.teeth i{width:12px;height:24px;border:1px solid #4c5664;border-radius:3px;background:#20262f}.vault.open .dial{transform:rotate(90deg)}.vault.open .lamp{background:#55e7af;box-shadow:0 0 12px #55e7af}.vault.open .unlock{color:#07140f;background:#73e6b8}.dial{transition:transform .55s cubic-bezier(.2,.8,.2,1)}@media(prefers-reduced-motion:reduce){.dial{transition:none}}
</style></head><body><main class="vault"><div class="top"><span>ECLIPSE VAULT · LOCAL DEMO</span><span class="lamp" aria-hidden="true"></span></div><div class="body"><div class="code"><label for="code">КОД ХРАНИЛИЩА</label><input id="code" type="password" value="2048" inputmode="numeric" maxlength="8" autocomplete="off"><button class="unlock" type="button">Открыть</button><small>Демо ничего не отправляет и не сохраняет.</small></div><button class="dial" type="button" aria-label="Повернуть диск хранилища"></button></div><div class="teeth" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></main><script>
const vault=document.querySelector('.vault'),dial=document.querySelector('.dial'),button=document.querySelector('.unlock');function toggle(){vault.classList.toggle('open');const open=vault.classList.contains('open');button.textContent=open?'Закрыть':'Открыть';dial.setAttribute('aria-pressed',String(open))}button.onclick=toggle;dial.onclick=toggle;const p=new URLSearchParams(location.search),t=Number(p.get('t'));if(Number.isFinite(t)&&t>12)toggle();
</script></body></html>
