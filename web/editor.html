<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library — редактор</title>
  <link rel="stylesheet" href="styles.css?v=30">
  <link rel="stylesheet" href="library-v2.css?v=1">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <main class="editor-page" data-editor-api="/editor-api">
    <header class="editor-header"><a href="/">Eclipse Library</a><span>Редактор</span><button id="logout" hidden>Выйти</button></header>
    <section id="login-view" class="editor-panel">
      <p class="eyebrow">PRIVATE EDITOR</p><h1>Редактор промптов</h1>
      <form id="login-form" class="editor-form"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required minlength="12"></label><button type="submit">Войти</button><p id="login-error" class="editor-error" role="alert"></p></form>
    </section>
    <section id="editor-view" class="editor-panel" hidden>
      <div class="editor-toolbar"><div><p class="eyebrow">IMAGE PROMPTS</p><h1>Примеры проектов</h1></div><span id="connection" class="editor-status">Подключение…</span></div>
      <form id="prompt-form" class="editor-form prompt-create-form"><label class="upload-dropzone"><input name="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif" required><span class="upload-dropzone__icon">＋</span><strong>Загрузить изображение</strong><small>PNG, JPG или WebP · до 6 МБ</small></label><label class="prompt-field"><span>Промпт для генерации</span><textarea name="prompt" placeholder="Например: кинематографичный портрет в мягком боковом свете, тёмный фон, формат 16:9…" required></textarea></label><button type="submit">Сохранить пример</button><p id="save-error" class="editor-error" role="alert"></p></form>
      <div id="prompt-list" class="editor-list" aria-live="polite"></div>
    </section>
  </main>
  <script type="module" src="editor.mjs"></script>
</body>
</html>
