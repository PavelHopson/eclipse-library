        <button type="button" data-icon="star"><svg viewBox="0 0 48 48"><path d="m24 5 5.7 11.6 12.8 1.9-9.3 9 2.2 12.8L24 34.2l-11.4 6.1 2.2-12.8-9.3-9 12.8-1.9z"/></svg><span>Избранное</span></button>
        <button type="button" data-icon="settings"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="7"/><path d="M24 5v6M24 37v6M5 24h6M37 24h6M10.5 10.5l4.3 4.3M33.2 33.2l4.3 4.3M37.5 10.5l-4.3 4.3M14.8 33.2l-4.3 4.3"/></svg><span>Настройки</span></button>
      </div>
    </section>
  </template>

  <template id="scene-file-upload">
    <section class="demo demo-upload" data-demo="file-upload" data-phase="idle" aria-label="Загрузка файлов">
      <div class="upload-v9"><label class="drop-v9" data-drop><input type="file" data-file multiple><i>↑</i><h2>Перетащите файлы или выберите</h2><p>До 3 демонстрационных файлов</p></label><ul class="upload-files-v9" data-files></ul><div class="upload-bar-v9"><i></i></div><footer><span data-upload-state>Ожидание файлов</span><button type="button" data-simulate>Показать загрузку →</button></footer></div>
    </section>
  </template>

  <template id="scene-fly-cart">
    <section class="demo demo-flycart" data-demo="fly-cart" data-phase="idle" aria-label="Полёт товара в корзину">
      <div class="fly-shop-v9"><header><h2>Популярное</h2><button class="fly-target-v9" type="button" aria-label="Корзина">Корзина <b data-fly-count>0</b></button></header><div class="fly-products-v9"><article><div class="can-v9 lime"><i></i><b>E</b></div><h3>Focus Drink</h3><p>390 ₽</p><button type="button" data-fly-add>Добавить</button></article><article><div class="can-v9 dark"><i></i><b>F</b></div><h3>Night Drink</h3><p>490 ₽</p><button type="button" data-fly-add>Добавить</button></article></div><aside class="fly-drawer-v9"><h3>Ваша корзина</h3><p data-fly-message>Пока пусто</p></aside><div class="flying-product-v9" aria-hidden="true"></div></div>
    </section>
  </template>

  <script src="animation-v9-preview.js?v=9"></script>
</body>
