<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spatial Sidebar — Eclipse Motion Lab</title><style>
/* Eclipse 3D contract: operational rail plane; responsive viewport */
:root{--accent:#6ba3ff;--speed:1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#02050a;color:#edf4ff;font:500 14px/1.4 Inter,system-ui;overflow:hidden}.scene{min-height:100vh;padding:22px;display:flex;background:radial-gradient(circle at 72% 28%,color-mix(in srgb,var(--accent) 17%,transparent),transparent 35%),linear-gradient(145deg,#182837,#04070c 65%);perspective:1000px}.scene:after{content:"";position:absolute;inset:35% 0 0;background:repeating-radial-gradient(ellipse at 70% 100%,#ffffff08 0 1px,transparent 2px 22px);opacity:.35;pointer-events:none}.sidebar{position:relative;z-index:1;width:280px;min-height:calc(100vh - 44px);display:flex;flex-direction:column;padding:14px;border:1px solid #ffffff17;border-radius:32px;background:linear-gradient(160deg,#ffffff0e,#ffffff04 55%,#0007);box-shadow:24px 30px 80px #0009,inset 0 1px #ffffff1c;backdrop-filter:blur(28px);transform:rotateY(2deg) translateZ(16px);transition:width calc(.35s/var(--speed)),transform calc(.35s/var(--speed))}.head{height:66px;display:flex;align-items:center;gap:12px;padding:0 10px;border-bottom:1px solid #ffffff12}.logo{width:34px;height:34px;border:1px solid #ffffff5c;border-radius:11px;display:grid;place-items:center;color:var(--accent)}.head b{font-size:18px}.collapse{margin-left:auto;width:44px;height:44px;border:0;border-radius:13px;background:transparent;color:#fff;cursor:pointer}.nav{list-style:none;margin:14px 0;padding:0;display:grid;gap:5px}.nav button{width:100%;min-height:50px;padding:0 14px;border:0;border-radius:14px;background:transparent;color:#c1ccdb;font:inherit;text-align:left;display:grid;grid-template-columns:25px 1fr auto;align-items:center;gap:9px;cursor:pointer}.nav button:hover,.nav button[aria-current=page],.nav button[aria-expanded=true]{background:#ffffff0d;color:#fff}.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.chev{transition:transform calc(.25s/var(--speed))}.nav button[aria-expanded=true] .chev{transform:rotate(180deg)}.sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows calc(.32s/var(--speed));overflow:hidden}.sub.open{grid-template-rows:1fr}.sub ul{min-height:0;list-style:none;margin:0;padding:0 0 0 42px}.sub button{min-height:39px;color:#94a4ba}.settings{margin-top:auto}.compact .sidebar{width:86px;transform:none}.compact .sidebar b,.compact .label,.compact .chev,.compact .sub{display:none}.compact .nav button{grid-template-columns:1fr;text-align:center}.compact .settings{margin-top:auto}.reduce *{transition-duration:.001ms!important}@media(max-width:560px){.scene{padding:12px}.sidebar{width:100%;min-height:calc(100vh - 24px);transform:none}.compact .sidebar{width:82px}}@media(prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}</style></head><body>
<main class="scene"><aside class="sidebar"><header class="head"><span class="logo">◇</span><b>Eclipse</b><button class="collapse" type="button" aria-label="Свернуть меню">☰</button></header><ul class="nav"><li><button type="button" aria-current="page"><span>⌂</span><span class="label">Обзор</span></button></li><li><button class="parent" type="button" aria-expanded="false"><span>◇</span><span class="label">Продукты</span><span class="chev">⌄</span></button><div class="sub"><ul><li><button type="button">AI Hub</button></li><li><button type="button">Library</button></li><li><button type="button">Sentinel</button></li></ul></div></li><li><button class="parent" type="button" aria-expanded="false"><span>◷</span><span class="label">Расписание</span><span class="chev">⌄</span></button><div class="sub"><ul><li><button type="button">Запуски</button></li><li><button type="button">Проверки</button></li></ul></div></li><li><button type="button"><span>◎</span><span class="label">Команда</span></button></li><li><button type="button"><span>◉</span><span class="label">Уведомления</span></button></li></ul><div class="settings"><button type="button"><span>⚙</span><span class="label">Настройки</span></button></div></aside></main>
<style>@media(pointer:fine){.sidebar:hover{transform:rotateY(0) translateZ(22px)}}</style>
<script>
const q=new URLSearchParams(location.search),scene=document.querySelector('.scene'),parents=[...document.querySelectorAll('.parent')],collapse=document.querySelector('.collapse');
function shut(except){parents.forEach(b=>{if(b!==except){b.setAttribute('aria-expanded','false');b.parentElement.querySelector('.sub').classList.remove('open')}})}
parents.forEach(b=>b.addEventListener('click',()=>{const on=b.getAttribute('aria-expanded')!=='true';shut(b);b.setAttribute('aria-expanded',String(on));b.parentElement.querySelector('.sub').classList.toggle('open',on)}));
collapse.addEventListener('click',()=>{scene.classList.toggle('compact');collapse.setAttribute('aria-label',scene.classList.contains('compact')?'Развернуть меню':'Свернуть меню')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')shut()});scene.style.setProperty('--accent',/^#[0-9a-f]{6}$/i.test(q.get('accent')||'')?q.get('accent'):'#6ba3ff');scene.style.setProperty('--speed',String(Math.max(.5,Number(q.get('speed'))||1)));if(q.get('reduce')==='1')scene.classList.add('reduce');if(q.get('state')==='open')parents[0].click();if(q.get('state')==='compact')scene.classList.add('compact');window.__ready=true;
</script></body></html>
