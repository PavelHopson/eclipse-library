const q=new URLSearchParams(location.search),reduce=q.get("reduce")==="1"||matchMedia("(prefers-reduced-motion: reduce)").matches,raw=q.get("t"),frozen=raw===null?null:Number(raw),files=[...document.querySelectorAll(".file")],summary=document.querySelector("#summary");let start=performance.now();
function paint(ms){const total=reduce?950:5200,unit=total/files.length,done=Math.min(files.length,Math.floor(ms/unit));files.forEach((file,i)=>{const p=Math.max(0,Math.min(100,(ms-i*unit)/unit*100));file.style.setProperty("--p",p);file.querySelector(".state").textContent=p>=100?"готово":p>0?Math.round(p)+"%":"в очереди";file.classList.toggle("done",p>=100)});summary.textContent=done+" из "+files.length}
if(frozen!==null&&Number.isFinite(frozen)){files.forEach(f=>{f.style.animation="none";f.style.opacity="1";f.style.transform="none"});paint(Math.max(0,frozen)*220);}else if(reduce)paint(3200);else requestAnimationFrame(function tick(now){const ms=(now-start)%6500;paint(Math.min(ms,5200));requestAnimationFrame(tick)});
