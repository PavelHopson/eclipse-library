<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload Queue</title>
<style>
:root{color-scheme:dark;--accent:#86c7ff;--glow:.45;--density:1;--speed:1;--bg:#070a0f;--panel:#0d121a;--line:#202b39;--text:#eef5ff;--muted:#8c9aad;--ok:#75dfb3;--bad:#ff8794;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 38%),var(--bg);color:var(--text)}button,input{font:inherit}.card{width:min(94vw,610px);border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#111824,#090d14);box-shadow:0 26px 80px #0009,0 0 calc(50px*var(--glow)) color-mix(in srgb,var(--accent) 14%,transparent);overflow:hidden}.head{padding:24px 24px 18px;display:flex;align-items:start;gap:16px;border-bottom:1px solid var(--line)}.head h1{font-size:18px;margin:0 0 5px}.head p,.meta{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.count{margin-left:auto;padding:7px 10px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:999px;color:var(--accent);font-size:11px}.drop{margin:18px 20px 10px;padding:18px;border:1px dashed #314156;border-radius:15px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color calc(180ms/var(--speed)),background calc(180ms/var(--speed)),transform calc(180ms/var(--speed))}.drop:hover,.drop.is-over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);transform:translateY(-1px)}.drop strong{display:block;font-size:13px}.drop span{font-size:11px;color:var(--muted)}.drop svg{width:24px;color:var(--accent)}#picker{position:absolute;inline-size:1px;block-size:1px;opacity:0}.queue{list-style:none;margin:0;padding:8px 20px 6px;display:grid;gap:9px}.file{position:relative;display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:calc(12px*var(--density));border:1px solid var(--line);border-radius:13px;background:#0b1018;transition:transform calc(260ms/var(--speed)) cubic-bezier(.2,.8,.2,1),opacity calc(180ms/var(--speed));overflow:hidden}.file::after{content:"";position:absolute;inset:auto 0 0;height:2px;background:linear-gradient(90deg,var(--accent) var(--progress),#202a38 0)}.thumb{inline-size:42px;block-size:42px;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--accent) 10%,#111923);color:var(--accent);font-weight:800;font-size:11px}.file strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file .status{font-size:10px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:4px}.icon{inline-size:30px;block-size:30px;border:0;border-radius:8px;background:transparent;color:#9cabc0;cursor:pointer}.icon:hover,.icon:focus-visible{background:#17202d;color:var(--text);outline:1px solid var(--accent)}.file[data-state=error]{border-color:#7d3440}.file[data-state=error] .status{color:var(--bad)}.file[data-state=complete] .thumb{color:var(--ok);background:#10251f}.foot{padding:14px 20px 19px;display:flex;align-items:center;gap:12px}.summary{font-size:11px;color:var(--muted)}.clear{margin-left:auto;border:0;background:transparent;color:var(--muted);cursor:pointer}.clear:hover{color:var(--text)}.sr{position:absolute;clip:rect(0 0 0 0);clip-path:inset(50%);width:1px;height:1px;overflow:hidden}.empty{padding:20px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:520px){.card{border-radius:0;min-height:100vh;width:100%}.head{padding:20px}.drop,.queue{margin-inline:14px;padding-inline:0}.drop{padding:15px}.file{grid-template-columns:38px 1fr auto}.thumb{width:38px;height:38px}.meta{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation-duration:.001ms!important;transition-duration:.001ms!important}.drop:hover{transform:none}}
</style>
</head>
<body>
<section class="card" aria-labelledby="title"><header class="head"><div><h1 id="title">Очередь загрузки</h1><p>Понятный статус и восстановление без потери файлов</p></div><output class="count" id="count">3 файла</output></header>
<label class="drop" id="drop"><input id="picker" type="file" multiple><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 15v4h14v-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span><strong>Перетащите файлы или выберите</strong><span>До 100 МБ · локальная безопасная демонстрация</span></span></label>
<ul class="queue" id="queue" aria-live="polite"></ul><footer class="foot"><span class="summary" id="summary"></span><button class="clear" id="clear" type="button">Убрать завершённые</button></footer><p class="sr" id="announce" aria-live="polite"></p></section>
<script>
const q=new URLSearchParams(location.search),accent=q.get('accent');if(accent&&/^#[0-9a-f]{6}$/i.test(accent))document.documentElement.style.setProperty('--accent',accent);['glow','density','speed'].forEach(k=>{const v=Number(q.get(k));if(Number.isFinite(v)&&v>0)document.documentElement.style.setProperty('--'+k,v)});if(q.get('contrast')==='1')document.documentElement.style.setProperty('--line','#4c6078');
const raw=q.get('t'),frozen=raw===null?null:Number(raw),initial=q.get('state')||'live';let id=4,timer;const queue=document.querySelector('#queue'),announce=document.querySelector('#announce');
let files=[{id:1,name:'release-demo.mp4',size:'42 МБ',progress:100,state:'complete'},{id:2,name:'product-tour.webm',size:'18 МБ',progress:64,state:'uploading'},{id:3,name:'brand-assets.zip',size:'12 МБ',progress:38,state:'paused'}];
if(initial==='error')files[1]={...files[1],state:'error',progress:57};if(initial==='complete')files=files.map(f=>({...f,state:'complete',progress:100}));if(initial==='paused')files[1].state='paused';
const labels={uploading:'Загружается',paused:'На паузе',error:'Соединение потеряно',complete:'Готово',queued:'В очереди'};
function icon(f){return f.state==='complete'?'✓':f.name.split('.').pop().slice(0,4).toUpperCase()}
function actions(f){if(f.state==='complete')return '<button class="icon" data-act="remove" aria-label="Убрать файл">×</button>';if(f.state==='error')return '<button class="icon" data-act="retry" aria-label="Повторить загрузку">↻</button><button class="icon" data-act="remove" aria-label="Отменить загрузку">×</button>';return '<button class="icon" data-act="'+(f.state==='paused'?'resume':'pause')+'" aria-label="'+(f.state==='paused'?'Продолжить':'Поставить на паузу')+'">'+(f.state==='paused'?'▶':'Ⅱ')+'</button><button class="icon" data-act="remove" aria-label="Отменить загрузку">×</button>'}
function render(){const first=new Map([...queue.children].map(n=>[n.dataset.id,n.getBoundingClientRect()]));queue.innerHTML=files.length?files.map(f=>'<li class="file" data-id="'+f.id+'" data-state="'+f.state+'" style="--progress:'+f.progress+'%"><span class="thumb">'+icon(f)+'</span><span><strong>'+escapeHtml(f.name)+'</strong><span class="status">'+labels[f.state]+' · '+f.progress+'% · '+f.size+'</span></span><span class="actions">'+actions(f)+'</span></li>').join(''):'<li class="empty">Очередь пуста — добавьте первый файл</li>';[...queue.children].forEach(n=>{const a=first.get(n.dataset.id),b=n.getBoundingClientRect();if(!a||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const dx=a.left-b.left,dy=a.top-b.top;if(dx||dy)n.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'})});const active=files.filter(f=>f.state!=='complete').length,done=files.length-active;document.querySelector('#count').value=files.length+' '+plural(files.length);document.querySelector('#summary').textContent=done+' готово · '+active+' требуют внимания'}
function plural(n){return n===1?'файл':n<5?'файла':'файлов'}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tick(){files.forEach(f=>{if(f.state==='queued')f.state='uploading';if(f.state==='uploading'){f.progress=Math.min(100,f.progress+1);if(f.progress===100){f.state='complete';announce.textContent=f.name+' загружен'}}});render()}
queue.addEventListener('click',e=>{const b=e.target.closest('button'),row=e.target.closest('.file');if(!b||!row)return;const f=files.find(x=>x.id===Number(row.dataset.id)),act=b.dataset.act;if(act==='remove')files=files.filter(x=>x!==f);if(act==='pause')f.state='paused';if(act==='resume'||act==='retry')f.state='uploading';announce.textContent=act==='retry'?'Повторная загрузка началась':'';render()});
function add(list){[...list].slice(0,5).forEach(file=>files.push({id:id++,name:file.name,size:Math.max(1,Math.round(file.size/1048576))+' МБ',progress:0,state:'queued'}));announce.textContent='Добавлено файлов: '+list.length;render()}
document.querySelector('#picker').addEventListener('change',e=>add(e.target.files));const drop=document.querySelector('#drop');['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('is-over')}));['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('is-over');if(t==='drop')add(e.dataTransfer.files)}));document.querySelector('#clear').addEventListener('click',()=>{files=files.filter(f=>f.state!=='complete');render()});
if(frozen!==null){files.forEach((f,i)=>{if(f.state==='uploading')f.progress=Math.min(99,Math.round((frozen*19+i*11)%100))})}else timer=setInterval(tick,700/Number(q.get('speed')||1));render();
</script>
</body></html>
