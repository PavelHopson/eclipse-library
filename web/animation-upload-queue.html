<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload Queue — Eclipse Motion</title><style>
:root{color-scheme:dark;--bg:#070b13;--card:#0d1420;--line:#233148;--cyan:#55e7ff;--green:#55e6ae}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 0,#10243a,transparent 50%),var(--bg);font:13px system-ui;color:#edf7ff}.panel{width:min(440px,100%);padding:18px;border:1px solid var(--line);border-radius:20px;background:rgba(9,16,27,.92);box-shadow:0 28px 70px #0009}.drop{display:grid;place-items:center;min-height:100px;border:1px dashed #36506f;border-radius:15px;color:#9fb0c5;text-align:center}.drop strong{display:block;color:white;font-size:15px}.queue{display:grid;gap:8px;margin-top:12px}.file{--p:0;position:relative;display:grid;grid-template-columns:45px 1fr auto;gap:10px;align-items:center;min-height:57px;padding:7px 10px;overflow:hidden;border:1px solid #1c2a3d;border-radius:13px;background:#0b1320;transform:translateY(8px);opacity:0}.file::after{content:"";position:absolute;inset:auto 0 0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--green));transform:scaleX(calc(var(--p)/100));transform-origin:left}.thumb{height:42px;border-radius:9px;background:linear-gradient(145deg,#ba8cff,#354b76);clip-path:inset(calc((100 - var(--p))*1%) 0 0)}.name{font-weight:700}.meta{color:#7190a9;font-size:10px}.state{color:var(--green);font-size:10px}.progress{display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:#8496ab;font-size:11px}.ring{width:16px;height:16px;border:2px solid #22354a;border-top-color:var(--cyan);border-radius:50%}.panel.run .file{animation:enter .35s both}.panel.run .file:nth-child(2){animation-delay:.12s}.panel.run .file:nth-child(3){animation-delay:.24s}.panel.run .file:nth-child(4){animation-delay:.36s}.panel.run .ring{animation:spin .8s linear infinite}@keyframes enter{to{transform:none;opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.panel.run .file{animation:none;transform:none;opacity:1}.panel.run .ring{animation:none;border-color:var(--cyan)}}
</style></head><body><main class="panel" aria-label="Очередь загрузки"><div class="drop"><div><strong>Перетащите файлы</strong>или выберите их на устройстве</div></div><div class="queue"><div class="file"><div class="thumb"></div><div><div class="name">eclipse-cover.webp</div><div class="meta">84 KB · изображение</div></div><div class="state">готово</div></div><div class="file"><div class="thumb"></div><div><div class="name">motion-guide.pdf</div><div class="meta">1.2 MB · документ</div></div><div class="state">готово</div></div><div class="file"><div class="thumb"></div><div><div class="name">demo-loop.mp4</div><div class="meta">8.4 MB · видео</div></div><div class="state" id="active-state">0%</div></div><div class="file"><div class="thumb"></div><div><div class="name">project-notes.md</div><div class="meta">7 KB · текст</div></div><div class="state">в очереди</div></div></div><div class="progress"><span>3 из 4 файлов</span><span class="ring" aria-hidden="true"></span></div></main><script>
const params=new URLSearchParams(location.search);const reduced=params.get('reduce')==='1'||matchMedia('(prefers-reduced-motion: reduce)').matches;const frozen=Number(params.get('t'));const panel=document.querySelector('.panel');const files=[...document.querySelectorAll('.file')];const active=document.querySelector('#active-state');panel.classList.add('run');function paint(p){files[0].style.setProperty('--p',100);files[1].style.setProperty('--p',100);files[2].style.setProperty('--p',p);files[3].style.setProperty('--p',0);active.textContent=`${Math.round(p)}%`}if(Number.isFinite(frozen)){paint(Math.min(100,frozen/24*100));files.forEach(f=>{f.style.opacity=1;f.style.transform='none'})}else if(reduced){paint(72)}else{const start=performance.now();function frame(now){const p=Math.min(100,(now-start)/2200*100);paint(p);if(p<100)requestAnimationFrame(frame);else active.textContent='готово'}requestAnimationFrame(frame)}
</script></body></html>
