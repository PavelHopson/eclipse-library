:root{--bg:#05080d;--panel:#0a1018;--panel2:#0e1621;--line:#263344;--text:#f5f8fc;--muted:#94a3b8;--accent:#6ba3ff;--success:#5ee6ad;--danger:#ff6b7a;--speed:1;--density:1;color-scheme:dark}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-height:100dvh;background:var(--bg);color:var(--text);font-family:Manrope,Arial,sans-serif}body *{font-family:Manrope,Arial,sans-serif!important}
button,input{font:inherit}button{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#101925;color:var(--text);cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{cursor:not-allowed;opacity:.45}input{width:100%;height:44px;border:1px solid var(--line);border-radius:9px;background:#080d14;color:var(--text);padding:0 12px;outline:0}input:focus{border-color:var(--accent)}:focus-visible{outline:2px solid #8bc5ff;outline-offset:3px}
.stage{min-height:100dvh;display:grid;place-items:center;padding:clamp(18px,4vw,52px);overflow:clip}.scene{width:min(980px,100%);display:grid;gap:22px}.scene-copy{display:grid;gap:7px}.scene-copy span{color:var(--accent);font:700 11px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase}.scene-copy h1{max-width:780px;margin:0;font-size:clamp(28px,5vw,56px);line-height:1.02;letter-spacing:-.04em}.scene-copy p{max-width:720px;margin:0;color:var(--muted);font-size:14px;line-height:1.55}.status{min-height:22px;margin:0;color:var(--muted);font-size:13px}.primary-action,.pay-form button,.checkout-fields button,.simple-login button,.v5-fields>button,.otp-box>button,.v3-form>button,.upload-card>button{border-color:color-mix(in srgb,var(--accent) 70%,var(--line));background:var(--accent);color:#06101e;font-weight:800}.text-action,[data-auth]{border:0;background:transparent;color:var(--accent);text-decoration:underline;text-underline-offset:4px}
label{display:grid;gap:6px;color:var(--muted);font-size:11px}h2{margin:0;font-size:22px}.scene [hidden]{display:none!important}
.tabs-scene{--tab:0}.light-tabs{position:relative;display:grid;grid-template-columns:repeat(4,1fr);padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.light-tabs button{position:relative;z-index:1;border:0;background:transparent;color:var(--muted)}.light-tabs button[aria-selected=true]{color:white}.light-rail{position:absolute;left:8px;bottom:7px;width:calc((100% - 16px)/4);height:3px;background:var(--accent);transform:translateX(calc(var(--tab)*100%));transition:transform calc(.48s/var(--speed)) cubic-bezier(.2,.8,.2,1)}.light-rail::before{content:"";position:absolute;inset:-8px 18% -8px;background:color-mix(in srgb,var(--accent) 28%,transparent);opacity:.75}.tab-panel{min-height:210px;padding:28px;border:1px solid var(--line);border-radius:14px;background:var(--panel);transition:opacity .18s}.tab-panel b{font-size:24px}.tab-panel p{color:var(--muted)}
.order-card{display:grid;gap:18px;padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.route{position:relative;height:190px;overflow:clip;border:1px solid var(--line);border-radius:14px;background:#0d141d}.road{position:absolute;bottom:45px;width:50%;height:58px;background:#222b35;transition:transform calc(.65s/var(--speed)) cubic-bezier(.2,.8,.2,1)}.road::after{content:"";position:absolute;left:10%;right:10%;top:28px;border-top:2px dashed #788596}.road-a{left:0;transform:translateX(100%)}.road-b{right:0;transform:translateX(-100%)}.depot,.home{position:absolute;bottom:103px;padding:8px 10px;border:1px solid var(--line);background:#121c28;font:700 9px ui-monospace,monospace}.depot{left:6%}.home{right:6%}.van{position:absolute;left:10%;bottom:74px;width:122px;height:48px;border:2px solid #f1f5f9;background:#dbe8f5;transform:translateX(-180%);transition:transform calc(1.8s/var(--speed)) cubic-bezier(.35,.05,.2,1)}.van::after{content:"";position:absolute;right:-34px;bottom:0;border-style:solid;border-width:0 0 46px 34px;border-color:transparent transparent #dbe8f5 transparent}.van i{position:absolute;inset:8px auto 8px 42px;width:28px;background:var(--accent)}.van b{position:absolute;left:8px;top:12px;color:#111}.van span{position:absolute;bottom:-12px;width:22px;height:22px;border:5px solid #9aa7b6;border-radius:50%;background:#111}.van span:first-of-type{left:17px}.van span:last-child{right:-25px}.order-scene[data-state=ordered] .road,.order-scene[data-state=complete] .road{transform:translateX(0)}.order-scene[data-state=ordered] .van{transform:translateX(85%)}.order-scene[data-state=complete] .van{transform:translateX(570%)}
.auth-card{position:relative;min-height:390px;display:grid;grid-template-columns:1fr 1fr;overflow:clip;border:1px solid var(--line);border-radius:18px;background:#f3f0e9;color:#132019}.auth-pane{display:grid;align-content:center;gap:14px;padding:34px;transition:transform calc(.55s/var(--speed)) cubic-bezier(.2,.8,.2,1),opacity .16s}.auth-pane input{background:transparent;color:#132019;border-color:#9ca79d}.auth-pane>button:not(.text-action){background:#113e31;color:white;border-color:#113e31}.auth-blade{position:absolute;z-index:3;inset:0 auto 0 0;width:50%;display:grid;align-content:center;padding:38px;background:#073a2e;color:white;transform:translateX(100%);transition:transform calc(.68s/var(--speed)) cubic-bezier(.2,.8,.2,1);pointer-events:none}.auth-blade b{color:#efc66b;letter-spacing:.16em}.blade-scene[data-state=signup] .auth-blade{transform:translateX(0)}.blade-scene[data-state=signup] .pane-signin{transform:translateX(100%);opacity:0}.blade-scene[data-state=signin] .pane-signup{transform:translateX(-100%);opacity:0}
.payment-grid,.checkout-shell,.v3-shell{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(300px,1.1fr);gap:18px;padding:22px;border:1px solid var(--line);border-radius:18px;background:#eef4fb;color:#0c1a2a}.card-preview,.mini-card{align-self:center;min-height:190px;display:grid;align-content:space-between;padding:24px;border:2px solid #8bb4e8;border-radius:17px;background:#dfefff;transition:transform calc(.7s/var(--speed)) cubic-bezier(.2,.8,.2,1),opacity .2s}.card-preview span,.mini-card span{font:700 10px ui-monospace,monospace;letter-spacing:.18em}.card-preview b,.mini-card b{font:700 18px ui-monospace,monospace}.pay-form,.checkout-fields,.v3-form{display:grid;align-content:center;gap:14px}.pay-form>div{display:grid;grid-template-columns:1fr 1fr;gap:10px}.payment-scene[data-state=loading] .card-preview{transform:translateX(26%) scale(.94);opacity:.55}.payment-scene[data-state=success] .card-preview{transform:translateX(52%);opacity:0}.payment-scene[data-state=error] .pay-form input{border-color:var(--danger)}

function clearTimers(){while(timers.length)clearTimeout(timers.pop())}
function setStatus(text){if(statusNode)statusNode.textContent=text||''}
function updateGated(state){const gated=document.querySelector('[data-gated]');if(!gated)return;const enabled=state!=='off';gated.toggleAttribute('inert',!enabled);gated.setAttribute('aria-hidden',String(!enabled));gated.querySelectorAll('input,button').forEach(el=>{el.disabled=!enabled});if(enabled&&document.activeElement?.matches('[data-lamp]'))gated.querySelector('input')?.focus()}
function setState(state){scene.dataset.state=state;setStatus(stateMessages[state]||state);updateGated(state);const label=document.querySelector('[data-action-label]');if(label)label.textContent=state==='complete'?'Заказ отправлен':state==='ordered'?'Готовим маршрут':'Подтвердить заказ'}
function play(){clearTimers();const phases=DEMO_PHASES;const finish=()=>setState(phases[phases.length-1][1]);if(reduce){setState(phases[0][1]);timers.push(setTimeout(finish,150));return}phases.forEach(([at,state])=>timers.push(setTimeout(()=>setState(state),at*1000/speed)))}
function seek(value){clearTimers();const t=Math.max(0,Number(value)||0);let state=DEMO_PHASES[0][1];for(const phase of DEMO_PHASES)if(t>=phase[0])state=phase[1];setState(state)}
function setAuth(mode){setState(mode);document.querySelectorAll('[data-auth]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.auth===mode)));const signin=document.querySelector('.pane-signin,.cloud-signin');const signup=document.querySelector('.pane-signup,.cloud-signup');if(signin){signin.toggleAttribute('inert',mode!=='signin');signin.setAttribute('aria-hidden',String(mode!=='signin'))}if(signup){signup.toggleAttribute('inert',mode!=='signup');signup.setAttribute('aria-hidden',String(mode!=='signup'))}const title=document.querySelector('[data-v5-title]');if(title)title.textContent=mode==='signup'?'Регистрация':'Вход'}
function formatCard(value){const digits=String(value||'').replace(/\D/g,'').slice(0,16);return (digits||'4242424242424242').replace(/(.{4})/g,'$1 ').trim()}
function animateToTarget(source,target,label){if(reduce){setStatus(label);return Promise.resolve()}const a=source.getBoundingClientRect(),b=target.getBoundingClientRect();const token=document.createElement('span');token.className=DEMO_ID==='fly-to-cart'?'fly-token':'delete-token';token.textContent=DEMO_ID==='fly-to-cart'?'EF':'×';token.style.left=a.left+'px';token.style.top=a.top+'px';document.body.append(token);const animation=token.animate([{transform:'translate(0,0)',opacity:1},{transform:'translate('+(b.left-a.left)+'px,'+(b.top-a.top)+'px) rotate(180deg)',opacity:.65},{transform:'translate('+(b.left-a.left)+'px,'+(b.top-a.top)+'px) rotate(360deg) scale(.5)',opacity:0}],{duration:760/speed,easing:'cubic-bezier(.2,.8,.2,1)'});return animation.finished.finally(()=>{token.remove();setStatus(label)})}
document.addEventListener('click',event=>{
 const primary=event.target.closest('[data-primary]');if(primary){if(DEMO_ID==='login-v5'){const email=document.querySelector('[data-email]')?.value||'';const password=document.querySelector('[data-password]')?.value||'';if(!/^\S+@\S+\.\S+$/.test(email)||password.length<8){setState('error');return}}play()}
 const auth=event.target.closest('[data-auth]');if(auth)setAuth(auth.dataset.auth);
 const lamp=event.target.closest('[data-lamp]');if(lamp){const on=scene.dataset.state==='off';lamp.setAttribute('aria-pressed',String(on));setState(on?'on':'off')}
 const tab=event.target.closest('[data-tab]');if(tab){const index=Number(tab.dataset.tab);scene.style.setProperty('--tab',String(index));document.querySelectorAll('[data-tab]').forEach((item,i)=>{item.setAttribute('aria-selected',String(i===index));item.tabIndex=i===index?0:-1});const titles=['Обзор','Проекты','Команда','Доступ'];const copies=['Ключевые события и состояние пространства.','Активные задачи и последние сборки.','Люди, агенты и доступные роли.','Разрешения, ключи и журнал подтверждений.'];document.querySelector('[data-tab-title]').textContent=titles[index];document.querySelector('[data-tab-copy]').textContent=copies[index];setState('active')}
 const icon=event.target.closest('[data-icon]');if(icon){document.querySelectorAll('[data-icon]').forEach(item=>item.removeAttribute('data-active'));icon.setAttribute('data-active','');setState('active');setStatus(icon.dataset.icon)}
 const add=event.target.closest('[data-add]');if(add){cartQuantity=Math.max(1,cartQuantity);renderCart();setState('added')}
 const qty=event.target.closest('[data-qty]');if(qty){cartQuantity=Math.max(0,cartQuantity+Number(qty.dataset.qty));renderCart();setState('updated')}
 const del=event.target.closest('[data-delete]');if(del)deleteRow(del);
 const undo=event.target.closest('[data-undo]');if(undo&&lastDeleted){lastDeleted.hidden=false;undo.hidden=true;setState('idle');setStatus('Файл восстановлен.');lastDeleted=null}
 const fly=event.target.closest('[data-fly-add]');if(fly)addFlyItem(fly);
});
document.addEventListener('focusin',event=>{if(event.target.matches('[data-cvc]'))setState('focus');if(event.target.matches('[data-password]'))document.querySelector('.panda')?.classList.add('is-private')});
document.addEventListener('focusout',event=>{if(event.target.matches('[data-cvc]')&&scene.dataset.state==='focus')setState('idle');if(event.target.matches('[data-password]'))document.querySelector('.panda')?.classList.remove('is-private')});
document.querySelectorAll('[data-card-input]').forEach(input=>input.addEventListener('input',()=>{input.value=formatCard(input.value);document.querySelectorAll('[data-card-number]').forEach(node=>node.textContent=formatCard(input.value));setState('typing')}));
document.querySelector('[data-holder-input]')?.addEventListener('input',event=>{document.querySelector('[data-holder]').textContent=(event.target.value||'ВАШЕ ИМЯ').toUpperCase().slice(0,24);setState('typing')});
document.querySelector('.light-tabs')?.addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();const tabs=[...document.querySelectorAll('[data-tab]')],current=tabs.indexOf(document.activeElement),next=(current+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[next].click();tabs[next].focus()});
let lastDeleted=null;async function deleteRow(button){const row=button.closest('li'),bin=document.querySelector('.bin');setState('deleting');await animateToTarget(row,bin,'Файл перемещён в корзину. Можно восстановить.');row.hidden=true;lastDeleted=row;document.querySelector('[data-undo]').hidden=false;setState('complete')}
let cartQuantity=0;function renderCart(){const line=document.querySelector('[data-cart-line]');if(!line)return;line.hidden=cartQuantity===0;document.querySelector('[data-qty-value]').textContent=String(cartQuantity);document.querySelector('[data-cart-count]').textContent=cartQuantity+' шт.';document.querySelector('[data-cart-total]').textContent=new Intl.NumberFormat('ru-RU').format(cartQuantity*1490)+' ₽'}
let flyCount=0;async function addFlyItem(button){const target=document.querySelector('.cart-target');setState('added');await animateToTarget(button.closest('article'),target,'Товар добавлен в корзину.');flyCount+=1;document.querySelector('[data-fly-count]').textContent=String(flyCount);setState('complete')}
const fileInput=document.querySelector('[data-file-input]'),drop=document.querySelector('[data-drop]');function renderFiles(files){const list=document.querySelector('.upload-list');if(!list)return;list.replaceChildren();[...files].slice(0,3).forEach(file=>{const li=document.createElement('li'),name=document.createElement('b'),size=document.createElement('small');name.textContent=file.name;size.textContent=Math.max(1,Math.round(file.size/1024))+' KB';li.append(name,size);list.append(li)});setState(files.length?'uploading':'idle');if(files.length)timers.push(setTimeout(()=>setState('complete'),reduce?150:1800/speed))}fileInput?.addEventListener('change',()=>renderFiles(fileInput.files));if(drop){['dragenter','dragover'].forEach(type=>drop.addEventListener(type,event=>{event.preventDefault();drop.classList.add('is-over')}));['dragleave','drop'].forEach(type=>drop.addEventListener(type,event=>{event.preventDefault();drop.classList.remove('is-over');if(type==='drop')renderFiles(event.dataTransfer.files)}))}
const otp=[...document.querySelectorAll('[data-otp]')];otp.forEach((input,index)=>{input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(-1);setState('typing');if(input.value)otp[index+1]?.focus()});input.addEventListener('keydown',event=>{if(event.key==='Backspace'&&!input.value)otp[index-1]?.focus()});input.addEventListener('paste',event=>{event.preventDefault();const digits=event.clipboardData.getData('text').replace(/\D/g,'').slice(0,6);digits.split('').forEach((digit,i)=>{if(otp[i])otp[i].value=digit});otp[Math.min(digits.length,5)]?.focus();setState('typing')})});
const explicit=params.get('state')||'live',time=params.get('t');if(time!==null)seek(time);else if(explicit==='live')timers.push(setTimeout(play,reduce?30:350));else if(explicit==='signin'||explicit==='signup')setAuth(explicit);else setState(explicit);
window.__ready=true;</script></body></html>
