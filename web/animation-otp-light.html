<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OTP Glass</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 18% 10%,#b9e7ff,transparent 30%),radial-gradient(circle at 80% 90%,#d7c4ff,transparent 34%),#eef6ff;color:#162239;font-family:Inter,system-ui}.card{width:min(90vw,480px);padding:35px 28px;border:1px solid #fff;border-radius:28px;background:#ffffff94;box-shadow:0 26px 80px #5279a52e,inset 0 1px #fff;backdrop-filter:blur(24px)}.shield{display:grid;place-items:center;width:48px;height:48px;margin:auto;border-radius:15px;background:linear-gradient(145deg,#eaf5ff,#fff);box-shadow:0 10px 30px #6288bb30;color:#397dd5;font-size:22px}h1{margin:17px 0 5px;text-align:center;font-size:24px}p{margin:0 0 24px;color:#718098;text-align:center;font-size:11px}.otp{display:flex;justify-content:center;gap:8px}.otp input{width:56px;height:62px;border:1px solid #cbd9e8;border-radius:13px;background:#fff9;color:#19304f;font:600 22px ui-monospace,monospace;text-align:center;outline:0;opacity:0;transform:scale(.82);animation:pop .35s cubic-bezier(.2,.9,.2,1.2) forwards;animation-delay:var(--d)}.otp input:focus{border-color:#6ba3ff;box-shadow:0 0 0 4px #6ba3ff22,0 9px 28px #4c83c82b}.verify{width:100%;height:48px;margin-top:22px;border:0;border-radius:13px;background:linear-gradient(100deg,#306fca,#65a7ff);color:white;font-weight:800;cursor:pointer;box-shadow:0 12px 30px #3779ca3b}.verify:disabled{filter:grayscale(.5);opacity:.5}.status{min-height:16px!important;margin:10px 0 0!important;color:#27845d}@keyframes pop{to{opacity:1;transform:none}}@media(max-width:500px){.card{padding-inline:14px}.otp{gap:5px}.otp input{width:43px;height:55px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important}}</style><body><main class="card"><div class="shield">◇</div><h1>Подтвердите вход</h1><p>Код отправлен на +7 ••• ••• 09 45</p><div class="otp" role="group" aria-label="Код подтверждения"><input style="--d:.04s" inputmode="numeric" maxlength="1"><input style="--d:.09s" inputmode="numeric" maxlength="1"><input style="--d:.14s" inputmode="numeric" maxlength="1"><input style="--d:.19s" inputmode="numeric" maxlength="1"><input style="--d:.24s" inputmode="numeric" maxlength="1"><input style="--d:.29s" inputmode="numeric" maxlength="1"></div><button class="verify" disabled>VERIFY OTP</button><p class="status" role="status"></p></main><script>
const boxes=[...document.querySelectorAll("input")],button=document.querySelector(".verify"),status=document.querySelector(".status"),q=new URLSearchParams(location.search),reduce=q.get("reduce")==="1"||matchMedia("(prefers-reduced-motion: reduce)").matches;function sync(){button.disabled=boxes.some(x=>!x.value)}function fill(s){boxes.forEach((b,i)=>b.value=s[i]||"");sync()}boxes.forEach((b,i)=>{b.setAttribute("aria-label","Цифра "+(i+1));b.oninput=()=>{b.value=b.value.replace(/\D/g,"").slice(-1);if(b.value&&i<5)boxes[i+1].focus();sync()};b.onpaste=e=>{e.preventDefault();fill(e.clipboardData.getData("text").replace(/\D/g,"").slice(0,6))}});button.onclick=()=>status.textContent="Личность подтверждена";if(!reduce){setTimeout(()=>fill("123"),650);setTimeout(()=>fill(""),1900)}
</script></body></html>
