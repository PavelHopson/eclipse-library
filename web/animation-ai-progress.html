<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Generation Progress</title>
<style>
:root{color-scheme:dark;--accent:#86c7ff;--glow:.45;--density:1;--speed:1;--bg:#070a0f;--panel:#0c121b;--line:#223043;--text:#f1f6ff;--muted:#8795aa;--ok:#72ddb0;--bad:#ff8593;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:var(--text);background:radial-gradient(circle at 50% 15%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 34%),var(--bg)}button{font:inherit}.shell{width:min(94vw,660px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#101824,#080c12);box-shadow:0 25px 90px #000b,0 0 calc(50px*var(--glow)) color-mix(in srgb,var(--accent) 14%,transparent);overflow:hidden}.head{display:flex;align-items:start;gap:18px;padding:23px 24px;border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0 0 5px}p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}.badge{margin-left:auto;padding:7px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 9%,transparent);border:1px solid color-mix(in srgb,var(--accent) 32%,var(--line));color:var(--accent);font-size:10px}.body{display:grid;grid-template-columns:1.12fr .88fr;min-height:350px}.visual{position:relative;display:grid;place-items:center;min-height:350px;border-right:1px solid var(--line);overflow:hidden}.orb{position:relative;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 42% 38%,#fff 0 2%,var(--accent) 3%,color-mix(in srgb,var(--accent) 35%,#111827) 28%,#090c12 69%);box-shadow:0 0 calc(60px*var(--glow)) color-mix(in srgb,var(--accent) 40%,transparent)}.orb::before,.orb::after{content:"";position:absolute;inset:-20px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:48% 52% 53% 47%;animation:orbit calc(6s/var(--speed)) linear infinite}.orb::after{inset:-38px;animation-duration:calc(10s/var(--speed));animation-direction:reverse;opacity:.45}.pulse{position:absolute;inset:50% auto auto 50%;width:5px;height:5px;background:#fff;border-radius:50%;box-shadow:0 0 18px var(--accent);animation:pulse calc(2s/var(--speed)) ease-out infinite}.percent{position:absolute;inset:50% auto auto 50%;translate:-50% -50%;font-size:27px;font-weight:650;letter-spacing:-.06em}.estimate{position:absolute;bottom:30px;font-size:10px;color:var(--muted)}.estimate strong{color:var(--text)}.panel{padding:22px;display:flex;flex-direction:column}.stages{list-style:none;margin:0;padding:0;display:grid;gap:12px}.stage{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;color:var(--muted);font-size:11px}.dot{width:9px;height:9px;border-radius:50%;border:1px solid #4c5a6c;justify-self:center}.stage.done{color:#bac7d8}.stage.done .dot{background:var(--ok);border-color:var(--ok)}.stage.active{color:var(--text)}.stage.active .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px color-mix(in srgb,var(--accent) 65%,transparent)}.stage.error{color:var(--bad)}.stage.error .dot{background:var(--bad);border-color:var(--bad)}.stage output{font-variant-numeric:tabular-nums}.log{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);min-height:93px}.log strong{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#b8c4d4}.events{margin-top:10px;display:grid;gap:6px;font:10px/1.4 ui-monospace,monospace;color:var(--muted)}.events span::before{content:"›";color:var(--accent);margin-right:7px}.actions{margin-top:auto;padding-top:18px;display:flex;gap:8px}.btn{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#111925;color:#c5d0df;cursor:pointer;font-size:11px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#071018;font-weight:700}.btn:hover,.btn:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 48%,transparent);outline-offset:2px}.shell[data-state=error] .orb{filter:saturate(.6);box-shadow:0 0 50px color-mix(in srgb,var(--bad) 30%,transparent)}.shell[data-state=complete] .orb::before,.shell[data-state=complete] .orb::after{animation:none;border-color:color-mix(in srgb,var(--ok) 50%,transparent)}@keyframes orbit{to{transform:rotate(1turn)}}@keyframes pulse{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(-50%,-50%) scale(24);opacity:0}}@media(max-width:560px){.shell{width:100%;min-height:100vh;border:0;border-radius:0}.body{grid-template-columns:1fr}.visual{min-height:285px;border-right:0;border-bottom:1px solid var(--line)}.panel{min-height:330px}}@media(prefers-reduced-motion:reduce){.orb::before,.orb::after,.pulse{animation:none}.orb::before{border-style:dashed}.stage.active .dot{box-shadow:none}}
/* Eclipse 3D contract: a reactor core for progress, not decorative motion. */
body{padding:24px;perspective:1450px;overflow-x:hidden}.shell{position:relative;isolation:isolate;overflow:visible;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform 180ms ease-out}.shell::before{content:"";position:absolute;z-index:-1;inset:17px -12px -16px 18px;border-radius:25px;background:#020408;transform:translateZ(-42px);box-shadow:0 42px 90px #000b}.shell::after{content:"";position:absolute;inset:1px;border-radius:23px;pointer-events:none;background:linear-gradient(120deg,#ffffff0b,transparent 25% 76%,color-mix(in srgb,var(--accent) 8%,transparent))}.head{position:relative;z-index:2;transform:translateZ(32px)}.body{position:relative;z-index:1;transform-style:preserve-3d}.visual{perspective:900px;transform-style:preserve-3d}.orb{transform:translateZ(54px) rotateX(12deg);box-shadow:0 26px 45px #000a,0 0 calc(75px*var(--glow)) color-mix(in srgb,var(--accent) 42%,transparent)}.orb::before{transform:rotateX(64deg);animation-name:orbit3d}.orb::after{transform:rotateY(64deg);animation-name:orbit3d-reverse}.percent{transform:translateZ(78px)}.estimate{transform:translateZ(28px)}.panel{transform:translateZ(20px)}.stage{padding:7px 8px;border:1px solid transparent;border-radius:9px;transition:transform 180ms,background-color 180ms}.stage.active{background:color-mix(in srgb,var(--accent) 7%,transparent);border-color:color-mix(in srgb,var(--accent) 20%,transparent);transform:translateZ(16px) translateX(3px)}@keyframes orbit3d{to{transform:rotateX(64deg) rotateZ(1turn)}}@keyframes orbit3d-reverse{to{transform:rotateY(64deg) rotateZ(-1turn)}}
@media(max-width:560px){body{padding:0}.shell{transform:none!important}.shell::before{display:none}.head,.panel,.orb,.percent,.estimate,.stage.active{transform:none}}@media(prefers-reduced-motion:reduce){.shell{transform:none!important}.shell::before{display:none}.orb,.percent,.estimate,.panel,.head,.stage.active{transform:none}.orb::before,.orb::after{animation:none}}
</style></head>
<body><section class="shell" id="shell" aria-labelledby="title"><header class="head"><div><h1 id="title">Генерация release-видео</h1><p>Прогресс по подтверждённым этапам, а не выдуманный таймер</p></div><span class="badge" id="badge">В работе</span></header><div class="body"><div class="visual"><div class="orb"><span class="pulse"></span><output class="percent" id="percent">41%</output></div><p class="estimate">Оценка: <strong id="eta">около 38 секунд</strong></p></div><section class="panel"><ol class="stages" id="stages"></ol><div class="log"><strong>Event log</strong><div class="events" id="events" aria-live="polite"></div></div><div class="actions"><button class="btn" id="cancel" type="button">Отменить</button><button class="btn primary" id="retry" type="button" hidden>Повторить</button></div></section></div></section>
<script>
const q=new URLSearchParams(location.search),root=document.documentElement,accent=q.get('accent');if(accent&&/^#[0-9a-f]{6}$/i.test(accent))root.style.setProperty('--accent',accent);['glow','density','speed'].forEach(k=>{const v=Number(q.get(k));if(Number.isFinite(v)&&v>0)root.style.setProperty('--'+k,v)});if(q.get('contrast')==='1')root.style.setProperty('--line','#52647a');
const defs=[['Подготовка запроса',12],['Генерация кадров',58],['Озвучка и субтитры',78],['Финальный render',100]],raw=q.get('t'),frozen=raw===null?null:Number(raw);let progress=41,state=q.get('state')||'generating',timer;const shell=document.querySelector('#shell'),events=document.querySelector('#events');
if(state==='preparing')progress=7;if(state==='rendering')progress=84;if(state==='complete')progress=100;if(state==='error')progress=63;
function current(){return defs.findIndex(x=>progress<x[1])<0?defs.length-1:defs.findIndex(x=>progress<x[1])}
function render(){const active=current(),error=state==='error';shell.dataset.state=state;document.querySelector('#stages').innerHTML=defs.map((d,i)=>'<li class="stage '+(i<active||state==='complete'?'done':i===active?(error?'error':'active'):'')+'"><span class="dot"></span><span>'+d[0]+'</span><output>'+(i<active||state==='complete'?'готово':i===active?(error?'ошибка':Math.max(1,Math.round(progress-(defs[i-1]?.[1]||0)))+'%'):'—')+'</output></li>').join('');document.querySelector('#percent').value=Math.round(progress)+'%';document.querySelector('#eta').textContent=state==='complete'?'готово':error?'нужен повтор':'около '+Math.max(8,Math.round((100-progress)*.65))+' секунд';document.querySelector('#badge').textContent=state==='complete'?'Готово':error?'Нужна помощь':state==='cancelled'?'Отменено':'В работе';document.querySelector('#cancel').hidden=['complete','error','cancelled'].includes(state);document.querySelector('#retry').hidden=!['error','cancelled'].includes(state)}
function note(s){const line=document.createElement('span');line.textContent=s;events.prepend(line);while(events.children.length>3)events.lastChild.remove()}
function tick(){if(['error','complete','cancelled'].includes(state))return;progress=Math.min(100,progress+.55);if(progress>12&&state==='preparing'){state='generating';note('Кадры поступают в compositor')}if(progress>78&&state!=='rendering'){state='rendering';note('Начат финальный render')}if(progress===100){state='complete';note('Artifact проверен и готов')}render()}
document.querySelector('#cancel').addEventListener('click',()=>{state='cancelled';note('Операция отменена пользователем');render()});document.querySelector('#retry').addEventListener('click',()=>{state='generating';progress=Math.max(14,progress-7);note('Повтор с последней checkpoint');render()});
note(state==='error'?'Render worker не ответил':'Проверка входных данных завершена');if(frozen!==null){progress=Math.min(100,Math.max(0,frozen*12));state=progress>78?'rendering':progress>12?'generating':'preparing'}else timer=setInterval(tick,100/Number(q.get('speed')||1));render();
const reduceMotion=q.get('reduce')==='1'||matchMedia('(prefers-reduced-motion: reduce)').matches;if(!reduceMotion&&matchMedia('(pointer:fine)').matches){shell.addEventListener('pointermove',e=>{const b=shell.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;requestAnimationFrame(()=>{shell.style.setProperty('--ry',(x*4).toFixed(2)+'deg');shell.style.setProperty('--rx',(-y*3).toFixed(2)+'deg')})});shell.addEventListener('pointerleave',()=>{shell.style.setProperty('--ry','0deg');shell.style.setProperty('--rx','0deg')})}window.__ready=true;
</script></body></html>
