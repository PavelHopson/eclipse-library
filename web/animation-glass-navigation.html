<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glass Navigation — Eclipse Motion Lab</title>
<style>
:root{--accent:#6ba3ff;--ink:#f5f7ff;--muted:#a6b2c8;--speed:1}
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:#050810;color:var(--ink);font:500 14px/1.4 Inter,ui-sans-serif,system-ui}
.scene{position:relative;min-height:100vh;perspective:900px;background:radial-gradient(circle at 78% 12%,color-mix(in srgb,var(--accent) 25%,transparent),transparent 30%),linear-gradient(160deg,#1a2540 0 28%,#0c1425 58%,#03050a 100%)}
.scene:before,.scene:after{content:"";position:absolute;inset:auto -10% 0;transform-origin:50% 100%;pointer-events:none}
.scene:before{height:72%;background:linear-gradient(150deg,#17284b,#090e1a 67%);clip-path:polygon(0 42%,14% 22%,25% 38%,42% 8%,53% 31%,66% 19%,80% 38%,100% 13%,100% 100%,0 100%);filter:drop-shadow(0 -20px 40px #0008)}
.scene:after{height:48%;background:#020409;clip-path:polygon(0 34%,20% 8%,38% 31%,57% 4%,73% 25%,100% 0,100% 100%,0 100%)}
.shell{position:relative;z-index:2;padding:22px clamp(14px,4vw,48px);transform-style:preserve-3d}
.nav{max-width:920px;margin:auto;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:26px;padding:10px 12px 10px 18px;border:1px solid #ffffff18;border-radius:28px;background:linear-gradient(135deg,#ffffff13,#ffffff07);box-shadow:0 26px 70px #0008,inset 0 1px #ffffff22;backdrop-filter:blur(24px);transform:translateZ(24px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:760}.mark{width:27px;aspect-ratio:1;border:1px solid #ffffff70;border-radius:9px;display:grid;place-items:center;box-shadow:inset 0 0 14px color-mix(in srgb,var(--accent) 45%,transparent)}.mark:after{content:"";width:9px;height:9px;border:2px solid var(--accent);transform:rotate(45deg)}
.menu{display:flex;justify-content:center;gap:4px}.item{position:relative}.trigger,.plain,.gear{min-height:44px;border:0;border-radius:16px;background:transparent;color:var(--muted);font:inherit;padding:0 15px;cursor:pointer}.trigger:hover,.plain:hover,.trigger[aria-expanded=true],.plain[aria-current=page]{color:var(--ink);background:#ffffff0e}.trigger:focus-visible,.plain:focus-visible,.gear:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.trigger:after{content:"";display:inline-block;width:6px;height:6px;margin-left:9px;border-right:1.5px solid;border-bottom:1.5px solid;transform:translateY(-2px) rotate(45deg);transition:transform calc(.25s/var(--speed))}
.trigger[aria-expanded=true]:after{transform:translateY(2px) rotate(225deg)}
.panel{position:absolute;top:calc(100% + 14px);left:50%;width:210px;padding:9px;display:grid;gap:4px;border:1px solid #ffffff18;border-radius:22px;background:#111a2be8;box-shadow:0 30px 70px #000a,inset 0 1px #ffffff1f;backdrop-filter:blur(26px);opacity:0;visibility:hidden;transform:translate(-50%,-10px) rotateX(-9deg) scale(.96);transform-origin:50% 0;transition:opacity calc(.22s/var(--speed)),transform calc(.32s/var(--speed)),visibility calc(.32s/var(--speed))}
.item.open .panel{opacity:1;visibility:visible;transform:translate(-50%,0) rotateX(0) scale(1)}
.panel a{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:9px;min-height:48px;padding:6px 9px;border-radius:14px;color:var(--ink);text-decoration:none}.panel a:hover,.panel a:focus-visible{background:#ffffff0d;outline:none}.icon{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.gear{width:44px;padding:0;font-size:18px}.caption{max-width:600px;margin:clamp(190px,38vh,340px) auto 0;text-align:center;position:relative;z-index:1}.caption small{color:var(--accent);letter-spacing:.18em;text-transform:uppercase}.caption h1{font-size:clamp(30px,6vw,68px);line-height:.96;margin:14px 0}.caption p{color:var(--muted);max-width:520px;margin:auto}
.compact .nav{max-width:360px;grid-template-columns:auto 1fr}.compact .menu{justify-content:flex-end}.compact .plain,.compact .gear{display:none}
.contrast{--ink:#fff;--muted:#d7e2f7}.reduce *{transition-duration:.001ms!important;animation-duration:.001ms!important}
@media(max-width:620px){.shell{padding:14px}.nav{grid-template-columns:auto 1fr;gap:8px;border-radius:22px}.brand span:last-child,.plain,.gear{display:none}.menu{justify-content:flex-end}.trigger{padding:0 12px}.panel{position:fixed;top:82px;left:14px;right:14px;width:auto;transform:translateY(-8px) scale(.97)}.item.open .panel{transform:none}.caption{margin-top:38vh}.caption p{padding:0 18px}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important}}
@media(pointer:fine){.nav{transition:transform calc(.3s/var(--speed))}.nav:hover{transform:translateZ(30px)}}html,body,.scene{max-width:100%;overflow-x:clip}.scene{min-height:100dvh;overflow:clip}/* Eclipse 3D contract: glass depth; responsive viewport */</style>
</head>
<body>
<main class="scene"><div class="shell">
<nav class="nav" aria-label="Основная навигация">
<div class="brand"><span class="mark" aria-hidden="true"></span><span>Eclipse</span></div>
<div class="menu">
<a class="plain" href="#about">Обзор</a>
<div class="item"><button class="trigger" type="button" aria-expanded="false" aria-controls="projects-panel">Проекты</button>
<div class="panel" id="projects-panel"><a href="#library"><span class="icon">◇</span><span><b>Library</b><br><small>Знания и инструменты</small></span></a><a href="#chat"><span class="icon">◎</span><span><b>Chat</b><br><small>Командная работа</small></span></a><a href="#hub"><span class="icon">✦</span><span><b>AI Hub</b><br><small>Модели и workflows</small></span></a></div></div>
<a class="plain" href="#contact">Контакты</a></div>
<button class="gear" type="button" aria-label="Повысить контраст">⚙</button>
</nav>
<section class="caption"><small>Navigation / spatial glass</small><h1>Один слой.<br>Ясный маршрут.</h1><p>Dropdown открывается кликом, управляется клавиатурой и не требует hover для основного сценария.</p></section>
</div></main>
<script>
const q=new URLSearchParams(location.search),scene=document.querySelector('.scene'),item=document.querySelector('.item'),trigger=document.querySelector('.trigger'),gear=document.querySelector('.gear');
const close=()=>{item.classList.remove('open');trigger.setAttribute('aria-expanded','false')};
const open=()=>{item.classList.add('open');trigger.setAttribute('aria-expanded','true')};
trigger.addEventListener('click',()=>item.classList.contains('open')?close():open());
document.addEventListener('click',e=>{if(!item.contains(e.target))close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();trigger.focus()}});
gear.addEventListener('click',()=>scene.classList.toggle('contrast'));
scene.style.setProperty('--accent',/^#[0-9a-f]{6}$/i.test(q.get('accent')||'')?q.get('accent'):'#6ba3ff');
scene.style.setProperty('--speed',String(Math.max(.5,Number(q.get('speed'))||1)));
window.__ready=true;
if(q.get('reduce')==='1')scene.classList.add('reduce');if(q.get('contrast')==='1')scene.classList.add('contrast');
if(q.get('state')==='open')open();if(q.get('state')==='compact'){scene.classList.add('compact');open()}
</script>
</body></html>
