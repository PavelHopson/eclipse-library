<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OTP Auth Kit</title>
<style>
:root{color-scheme:dark;--accent:#86c7ff;--glow:.45;--density:1;--speed:1;--bg:#070a0f;--panel:#0d131d;--line:#263247;--text:#f0f6ff;--muted:#8e9caf;--bad:#ff8794;--ok:#71ddb0;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 34%),var(--bg);color:var(--text)}button,input{font:inherit}.card{width:min(92vw,470px);padding:30px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#111925,#090d14);box-shadow:0 24px 80px #000a,0 0 calc(48px*var(--glow)) color-mix(in srgb,var(--accent) 14%,transparent)}.mark{width:42px;height:42px;border:1px solid color-mix(in srgb,var(--accent) 38%,var(--line));border-radius:12px;display:grid;place-items:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);margin-bottom:22px}h1{font-size:21px;margin:0 0 8px;letter-spacing:-.03em}.lead{font-size:12px;color:var(--muted);line-height:1.55;margin:0}.code{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:25px 0 16px}.digit{min-width:0;height:55px;border:1px solid var(--line);border-radius:12px;background:#0a1018;color:var(--text);text-align:center;font-size:20px;font-weight:650;outline:0;caret-color:var(--accent);transition:border-color calc(150ms/var(--speed)),box-shadow calc(150ms/var(--speed)),transform calc(180ms/var(--speed))}.digit:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}.status{min-height:20px;color:var(--muted);font-size:11px;margin:0 0 15px}.verify{width:100%;height:45px;border:0;border-radius:11px;background:var(--accent);color:#071018;font-weight:750;cursor:pointer}.verify:disabled{opacity:.45;cursor:not-allowed}.verify:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.foot{margin-top:17px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.link{border:0;background:transparent;color:var(--accent);cursor:pointer;padding:5px}.link:disabled{color:var(--muted);cursor:not-allowed}.card.error .code{animation:shake calc(360ms/var(--speed)) ease}.card.error .digit{border-color:var(--bad)}.card.error .status{color:var(--bad)}.card.success .digit{border-color:var(--ok);color:var(--ok)}.card.success .status{color:var(--ok)}.spinner{display:inline-block;width:13px;height:13px;border:2px solid #07101855;border-top-color:#071018;border-radius:50%;animation:spin calc(.7s/var(--speed)) linear infinite;vertical-align:-2px;margin-right:7px}@keyframes spin{to{transform:rotate(1turn)}}@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}@media(max-width:430px){.card{width:100%;min-height:100vh;border:0;border-radius:0;padding:28px 20px}.code{gap:6px}.digit{height:52px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}.card.error .code{animation:none}.card.error .digit:first-child{box-shadow:inset 4px 0 var(--bad)}}
/* Eclipse 3D contract: six code cells form one spatial authentication object. */
body{padding:clamp(10px,3vmin,24px);min-height:100dvh;perspective:1350px;overflow-x:hidden}.card{position:relative;isolation:isolate;width:min(100%,470px);max-width:100%;overflow:clip;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform 180ms ease-out;box-shadow:0 44px 100px #000c,0 0 calc(58px*var(--glow)) color-mix(in srgb,var(--accent) 15%,transparent)}.card::before{content:"";position:absolute;z-index:-1;inset:10px;border-radius:17px;background:#020408;transform:translateZ(-38px)}.card::after{content:"";position:absolute;inset:1px;border-radius:23px;pointer-events:none;background:linear-gradient(115deg,#ffffff0c,transparent 26% 74%,color-mix(in srgb,var(--accent) 9%,transparent))}.mark,h1,.lead,.code,.status,.verify,.foot{position:relative;z-index:1;min-width:0}.mark{transform:translateZ(46px);box-shadow:0 14px 30px #0007,inset 0 1px #ffffff16}.code{perspective:800px;transform-style:preserve-3d;transform:translateZ(28px)}.digit{box-shadow:0 13px 22px #0006,inset 0 1px #ffffff0a;transform:translateZ(8px)}.digit:focus{transform:translateZ(28px) translateY(-3px)}.card.success .digit{transform:translateZ(20px)}.verify{transform:translateZ(24px);box-shadow:0 16px 28px #0006}.foot{transform:translateZ(14px)}
@media(max-width:430px){body{padding:0}.card{transform:none!important}.card::before{display:none}.mark,.code,.digit,.digit:focus,.verify,.foot{transform:none}}@media(prefers-reduced-motion:reduce){.card{transform:none!important}.card::before{display:none}.mark,.code,.digit,.digit:focus,.card.success .digit,.verify,.foot{transform:none}}
</style></head>
<body><main class="card" id="card"><div class="mark" aria-hidden="true">✦</div><h1>Подтвердите вход</h1><p class="lead">Код отправлен на p•••@eclipse-forge.ru. Можно вставить все шесть цифр сразу.</p><div class="code" id="code" aria-label="Шестизначный код"></div><p class="status" id="status" aria-live="polite">Введите код из письма</p><button class="verify" id="verify" type="button" disabled>Продолжить</button><div class="foot"><span id="timer">Новый код через 0:30</span><button class="link" id="resend" type="button" disabled>Отправить снова</button></div></main>
<script>
const q=new URLSearchParams(location.search),root=document.documentElement,accent=q.get('accent');if(accent&&/^#[0-9a-f]{6}$/i.test(accent))root.style.setProperty('--accent',accent);['glow','density','speed'].forEach(k=>{const v=Number(q.get(k));if(Number.isFinite(v)&&v>0)root.style.setProperty('--'+k,v)});if(q.get('contrast')==='1')root.style.setProperty('--line','#53667e');
const code=document.querySelector('#code'),card=document.querySelector('#card'),verify=document.querySelector('#verify'),statusEl=document.querySelector('#status'),resend=document.querySelector('#resend'),timerEl=document.querySelector('#timer');let seconds=30,busy=false,initial=q.get('state')||'idle';
code.innerHTML=Array.from({length:6},(_,i)=>'<input class="digit" aria-label="Цифра '+(i+1)+' из 6" inputmode="numeric" autocomplete="'+(i?'off':'one-time-code')+'" maxlength="1">').join('');const inputs=[...document.querySelectorAll('.digit')];
function value(){return inputs.map(x=>x.value).join('')}function setClass(name=''){card.className='card '+name}function update(){verify.disabled=value().length!==6||busy}
function fill(text,start=0){const nums=text.replace(/\D/g,'').slice(0,6);nums.split('').forEach((n,i)=>{if(inputs[start+i])inputs[start+i].value=n});inputs[Math.min(start+nums.length,5)].focus();update()}
inputs.forEach((input,i)=>{input.addEventListener('input',e=>{const n=e.target.value.replace(/\D/g,'');e.target.value=n.slice(-1);setClass();statusEl.textContent='Введите код из письма';if(n&&i<5)inputs[i+1].focus();update()});input.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!input.value&&i){inputs[i-1].focus();inputs[i-1].value='';update()}if(e.key==='ArrowLeft'&&i)inputs[i-1].focus();if(e.key==='ArrowRight'&&i<5)inputs[i+1].focus()});input.addEventListener('paste',e=>{e.preventDefault();fill(e.clipboardData.getData('text'),i)})});
async function validate(){if(verify.disabled)return;busy=true;update();setClass();statusEl.textContent='Проверяем защищённое соединение…';verify.innerHTML='<span class="spinner"></span>Проверяем';await new Promise(r=>setTimeout(r,650/Number(q.get('speed')||1)));busy=false;if(value()==='204815'){setClass('success');statusEl.textContent='Вход подтверждён. Перенаправляем…';verify.textContent='Готово';verify.disabled=true}else{setClass('error');statusEl.textContent='Код не подошёл. Проверьте цифры или запросите новый.';verify.textContent='Повторить';update();inputs[0].focus()}}
verify.addEventListener('click',validate);resend.addEventListener('click',()=>{seconds=30;resend.disabled=true;inputs.forEach(x=>x.value='');inputs[0].focus();setClass();statusEl.textContent='Новый код отправлен';update()});setInterval(()=>{if(seconds>0)seconds--;resend.disabled=seconds>0;timerEl.textContent=seconds?'Новый код через 0:'+String(seconds).padStart(2,'0'):'Код не пришёл?';},1000);
if(initial==='typing')fill('204');if(initial==='loading'){fill('204815');validate()}if(initial==='error'){fill('061947');setTimeout(validate,50)}if(initial==='success'){fill('204815');setClass('success');statusEl.textContent='Вход подтверждён';verify.textContent='Готово';verify.disabled=true}if(initial==='expired'){seconds=0;statusEl.textContent='Срок действия кода истёк. Запросите новый.'}inputs[0].focus();update();
const reduceMotion=q.get('reduce')==='1'||matchMedia('(prefers-reduced-motion: reduce)').matches;if(!reduceMotion&&matchMedia('(pointer:fine)').matches){card.addEventListener('pointermove',e=>{const b=card.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;requestAnimationFrame(()=>{card.style.setProperty('--ry',(x*5).toFixed(2)+'deg');card.style.setProperty('--rx',(-y*4).toFixed(2)+'deg')})});card.addEventListener('pointerleave',()=>{card.style.setProperty('--ry','0deg');card.style.setProperty('--rx','0deg')})}window.__ready=true;
</script></body></html>
