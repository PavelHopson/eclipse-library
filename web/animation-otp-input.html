<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OTP Terminal</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#17253a,transparent 45%),#06090e;color:#f2f5fa;font-family:Inter,system-ui}.card{width:min(92vw,510px);padding:30px;border:1px solid #2b3749;border-radius:23px;background:#0c111a;box-shadow:0 28px 80px #0008}header{display:flex;justify-content:space-between;color:#738096;font:9px ui-monospace,monospace;letter-spacing:.14em}h1{margin:22px 0 5px;font-size:25px;text-align:center}p{margin:0 0 23px;color:#7b8797;font-size:11px;text-align:center}.otp{display:flex;justify-content:center;gap:9px}.otp input{width:58px;height:66px;border:1px solid #2b3748;border-radius:14px;background:#121925;color:white;font:600 23px ui-monospace,monospace;text-align:center;outline:0;opacity:0;transform:translateY(13px);animation:in .35s ease forwards;animation-delay:var(--d)}.otp input:focus{border-color:#6ba3ff;box-shadow:0 0 0 3px #6ba3ff20,0 0 24px #4f8de144}.verify{display:block;width:100%;height:46px;margin-top:22px;border:0;border-radius:11px;background:#356fcb;color:white;font-weight:700;cursor:pointer}.verify:disabled{opacity:.35}.status{min-height:18px;margin:12px 0 0!important}.status.ok{color:#58dfa5}.status.error{color:#ff7c83}.resend{display:block;margin:2px auto 0;border:0;background:none;color:#6ba3ff;font-size:10px;cursor:pointer}@keyframes in{to{opacity:1;transform:none}}@media(max-width:520px){.card{padding:22px 14px}.otp{gap:5px}.otp input{width:44px;height:56px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important}}</style><body><main class="card"><header><span>ECLIPSE ID</span><span>SECURE · 2FA</span></header><h1>Введите код</h1><p>Мы отправили 6 цифр на p•••@eclipse-forge.ru</p><div class="otp" role="group" aria-label="Шестизначный код"><input style="--d:.04s" inputmode="numeric" maxlength="1" aria-label="Цифра 1"><input style="--d:.09s" inputmode="numeric" maxlength="1" aria-label="Цифра 2"><input style="--d:.14s" inputmode="numeric" maxlength="1" aria-label="Цифра 3"><input style="--d:.19s" inputmode="numeric" maxlength="1" aria-label="Цифра 4"><input style="--d:.24s" inputmode="numeric" maxlength="1" aria-label="Цифра 5"><input style="--d:.29s" inputmode="numeric" maxlength="1" aria-label="Цифра 6"></div><button class="verify" disabled>Подтвердить код</button><p class="status" role="status"></p><button class="resend">Отправить снова</button></main><script>
const boxes=[...document.querySelectorAll(".otp input")],verify=document.querySelector(".verify"),status=document.querySelector(".status"),q=new URLSearchParams(location.search),raw=q.get("t"),frozen=raw===null?null:Number(raw),reduce=q.get("reduce")==="1"||matchMedia("(prefers-reduced-motion: reduce)").matches;function sync(){verify.disabled=boxes.some(x=>!x.value)}function fill(text){const d=text.replace(/\D/g,"").slice(0,6);boxes.forEach((b,i)=>b.value=d[i]||"");sync()}boxes.forEach((b,i)=>{b.oninput=()=>{b.value=b.value.replace(/\D/g,"").slice(-1);if(b.value&&i<5)boxes[i+1].focus();sync()};b.onkeydown=e=>{if(e.key==="Backspace"&&!b.value&&i)boxes[i-1].focus();if(e.key==="ArrowLeft"&&i)boxes[i-1].focus();if(e.key==="ArrowRight"&&i<5)boxes[i+1].focus()};b.onpaste=e=>{e.preventDefault();fill(e.clipboardData.getData("text"));boxes[5].focus()}});verify.onclick=()=>{const ok=boxes.map(x=>x.value).join("")==="204815";status.textContent=ok?"Код подтверждён":"Код не подошёл. Проверьте цифры.";status.className="status "+(ok?"ok":"error")};document.querySelector(".resend").onclick=()=>{status.textContent="Новый код отправлен";status.className="status"};if(frozen!==null&&Number.isFinite(frozen))fill("204815".slice(0,Math.min(6,Math.ceil(frozen/4))));else if(!reduce){setTimeout(()=>fill("204"),700);setTimeout(()=>{fill("");boxes[0].focus()},2100)}
</script></body></html>
