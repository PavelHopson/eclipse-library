<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accessible OTP — Eclipse Motion</title><style>
:root{color-scheme:dark;--bg:#07090f;--card:#10141e;--line:#2a3140;--text:#f5f7ff;--muted:#8993a5;--accent:#58a5ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 20%,#17243c,#06080d 62%);font:13px system-ui;color:var(--text)}.card{width:min(440px,100%);padding:28px;border:1px solid var(--line);border-radius:24px;background:rgba(13,17,26,.94);box-shadow:0 30px 80px #000a;text-align:center}.mark{width:42px;height:42px;margin:auto;border:1px solid #34445d;border-radius:14px;background:conic-gradient(from 180deg,#5c8cff,#a16eff,#50d9f3,#5c8cff);box-shadow:inset 0 0 0 9px #111722}.card h1{margin:16px 0 6px;font-size:21px}.card>p{margin:0;color:var(--muted)}.otp{display:flex;justify-content:center;gap:8px;margin:25px 0 12px}.otp input{width:48px;height:55px;border:1px solid #30394b;border-radius:13px;background:#151a25;color:white;font:700 20px ui-monospace,monospace;text-align:center;outline:0;transition:transform .14s,border-color .14s,box-shadow .14s}.otp input:focus{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 0 0 3px #459cff1c}.status{min-height:20px;color:#909bad;font-size:11px}.status.error{color:#ff879b;animation:shake .28s linear}.status.ok{color:#5ce1b2}.verify{width:100%;min-height:44px;margin-top:10px;border:0;border-radius:12px;background:#edf2ff;color:#080b12;font-weight:800;cursor:pointer}.verify:disabled{opacity:.42;cursor:not-allowed}.resend{display:inline-block;margin-top:16px;border:0;background:transparent;color:#83afff;font-size:11px;cursor:pointer}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@media(prefers-reduced-motion:reduce){.otp input{transition:none}.otp input:focus{transform:none}.status.error{animation:none}}
</style></head><body><main class="card"><div class="mark" aria-hidden="true"></div><h1>Подтвердите вход</h1><p>Код отправлен на pavel•••@mail.ru</p><div class="otp" role="group" aria-label="Шестизначный код подтверждения"><input inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Цифра 1"><input inputmode="numeric" maxlength="1" aria-label="Цифра 2"><input inputmode="numeric" maxlength="1" aria-label="Цифра 3"><input inputmode="numeric" maxlength="1" aria-label="Цифра 4"><input inputmode="numeric" maxlength="1" aria-label="Цифра 5"><input inputmode="numeric" maxlength="1" aria-label="Цифра 6"></div><div class="status" role="status">Можно вставить весь код сразу</div><button class="verify" type="button" disabled>Проверить код</button><button class="resend" type="button">Отправить ещё раз</button></main><script>
const boxes=[...document.querySelectorAll('.otp input')],status=document.querySelector('.status'),verify=document.querySelector('.verify');function sync(){verify.disabled=boxes.some(x=>!x.value)}function fill(text){[...text.replace(/\D/g,'').slice(0,6)].forEach((v,i)=>boxes[i].value=v);boxes[Math.min(5,text.length)].focus();sync()}boxes.forEach((box,i)=>{box.addEventListener('input',e=>{box.value=box.value.replace(/\D/g,'').slice(-1);if(box.value&&i<5)boxes[i+1].focus();sync()});box.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!box.value&&i)boxes[i-1].focus();if(e.key==='ArrowLeft'&&i)boxes[i-1].focus();if(e.key==='ArrowRight'&&i<5)boxes[i+1].focus()});box.addEventListener('paste',e=>{e.preventDefault();fill(e.clipboardData.getData('text'))})});verify.onclick=()=>{status.className='status';if(boxes.map(x=>x.value).join('')==='204815'){status.textContent='Код подтверждён';status.classList.add('ok')}else{status.textContent='Код не подошёл. Проверьте цифры.';status.classList.add('error');boxes[0].focus()}};document.querySelector('.resend').onclick=e=>{status.className='status';status.textContent='Новый код отправлен';e.currentTarget.disabled=true;setTimeout(()=>e.currentTarget.disabled=false,1200)};const p=new URLSearchParams(location.search),t=Number(p.get('t'));if(Number.isFinite(t)&&t>0)fill('204815'.slice(0,Math.min(6,Math.ceil(t/4))));
</script></body></html>
