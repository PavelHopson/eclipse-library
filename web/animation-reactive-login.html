<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guardian Login</title><link rel="icon" href="data:,"><style>:root{--accent:#6ba3ff;--glow:.45;--density:1;--speed:1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 0,#152943,transparent 44%),#06090e;color:#eef6ff;font-family:Inter,system-ui}.card{width:min(90vw,390px);padding:26px;border:1px solid #304158;border-radius:24px;background:rgba(11,17,27,.91);box-shadow:0 30px 90px #000a}.guardian{position:relative;width:106px;height:88px;margin:-2px auto 14px}.head{position:absolute;left:15px;top:5px;width:76px;height:72px;border:2px solid var(--accent);border-radius:42% 42% 48% 48%;background:#101d2b;box-shadow:0 0 28px #4c8ef344}.ear{position:absolute;top:0;width:28px;height:34px;border:2px solid var(--accent);background:#101d2b;transform:rotate(45deg)}.ear.a{left:13px}.ear.b{right:13px;transform:rotate(135deg)}.face{position:absolute;inset:0}.eye{position:absolute;top:32px;width:18px;height:14px;border-radius:50%;background:#dff7ff;overflow:hidden;transition:height .18s,transform .18s}.eye.a{left:20px}.eye.b{right:20px}.pupil{position:absolute;left:6px;top:4px;width:6px;height:6px;border-radius:50%;background:#071018;transition:transform .08s}.mouth{position:absolute;left:31px;top:54px;width:15px;height:6px;border-bottom:2px solid #77a9dc;border-radius:50%;transition:transform .2s}.guardian.hide .eye{height:2px;transform:translateY(6px)}.guardian.happy .mouth{transform:scaleX(1.5) translateY(-2px)}h1{margin:0;text-align:center;font-size:21px}p{margin:5px 0 19px;color:#77869a;text-align:center;font-size:11px}.field{display:grid;gap:6px;margin:11px 0}.field span{color:#75869b;font-size:9px}.field input{width:100%;height:48px;padding:0 13px;border:1px solid #2a3a4e;border-radius:11px;background:#101723;color:white;outline:0}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 11%,transparent),0 0 20px #3578d22c}.row{display:flex;justify-content:space-between;color:#6f8298;font-size:9px}.submit{position:relative;width:100%;height:48px;margin-top:16px;border:0;border-radius:11px;background:linear-gradient(100deg,#2f78ef,var(--accent));color:white;font-weight:700;cursor:pointer;overflow:hidden}.submit::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff4,transparent);transform:translateX(-110%)}.submit.busy::after{animation:sweep .8s ease}.status{min-height:16px;margin:10px 0 0;color:#5ee0a7;font-size:10px}@keyframes sweep{to{transform:translateX(110%)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><body><script>(()=>{const p=new URLSearchParams(location.search),r=document.documentElement,a=p.get("accent");if(a&&/^#[0-9a-f]{6}$/i.test(a))r.style.setProperty("--accent",a);["glow","density","speed"].forEach(k=>{const v=Number(p.get(k));if(Number.isFinite(v)&&v>0)r.style.setProperty("--"+k,v)});if(p.get("contrast")==="1")r.style.filter="contrast(1.12)"})()</script><form class="card"><div class="guardian" aria-hidden="true"><i class="ear a"></i><i class="ear b"></i><div class="head"><span class="face"><i class="eye a"><b class="pupil"></b></i><i class="eye b"><b class="pupil"></b></i><i class="mouth"></i></span></div></div><h1>С возвращением</h1><p>Eclipse Guardian следит только за безопасностью входа.</p><label class="field"><span>EMAIL</span><input type="email" value="pavel@eclipse-forge.ru" autocomplete="email"></label><label class="field"><span>PASSWORD</span><input class="password" type="password" placeholder="Введите пароль" autocomplete="current-password"></label><div class="row"><label><input type="checkbox"> Запомнить</label><span>Забыли пароль?</span></div><button class="submit" type="submit">Войти</button><p class="status" role="status"></p></form><script>
const q=new URLSearchParams(location.search),reduce=q.get("reduce")==="1"||matchMedia("(prefers-reduced-motion: reduce)").matches,g=document.querySelector(".guardian"),pupils=[...document.querySelectorAll(".pupil")],pass=document.querySelector(".password"),button=document.querySelector(".submit"),status=document.querySelector(".status");
if(!reduce)window.addEventListener("pointermove",e=>{const r=g.getBoundingClientRect(),x=Math.max(-4,Math.min(4,(e.clientX-(r.left+r.width/2))/35)),y=Math.max(-3,Math.min(3,(e.clientY-(r.top+r.height/2))/35));pupils.forEach(p=>p.style.transform="translate("+x+"px,"+y+"px)")});
pass.addEventListener("focus",()=>g.classList.add("hide"));pass.addEventListener("blur",()=>g.classList.remove("hide"));
setInterval(()=>{if(!reduce&&!g.classList.contains("hide")){g.classList.add("hide");setTimeout(()=>g.classList.remove("hide"),160)}},2800);
document.querySelector("form").onsubmit=e=>{e.preventDefault();button.classList.remove("busy");void button.offsetWidth;button.classList.add("busy");g.classList.add("happy");status.textContent="Проверяем защищённую сессию…";setTimeout(()=>status.textContent="Готово. Вход подтверждён",750)};const initial=q.get("state")||"idle";if(initial==="loading"){button.click();status.textContent="Проверяем защищённую сессию…"}if(initial==="error"){status.style.color="#ff8794";status.textContent="Пароль не подошёл. Проверьте ввод."}if(initial==="success"){g.classList.add("happy");status.textContent="Готово. Вход подтверждён"}
</script></body></html>
