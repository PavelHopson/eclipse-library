<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reactive Login — Eclipse Motion</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 10%,#152747,#070a11 58%);font:13px system-ui;color:#f4f7ff}.card{width:min(360px,100%);padding:24px;border:1px solid #26354c;border-radius:24px;background:linear-gradient(150deg,#111928e8,#0a0e17f2);box-shadow:0 32px 80px #0009}.sentinel{position:relative;width:72px;height:72px;margin:0 auto 16px;border:1px solid #354966;border-radius:50%;background:radial-gradient(circle at 50% 65%,#18243a,#080b12 70%);box-shadow:0 0 28px #3876ff33}.eye{position:absolute;top:28px;width:13px;height:13px;border:2px solid #7eeeff;border-radius:50%}.eye::after{content:"";position:absolute;inset:3px;border-radius:50%;background:white;transform:translate(var(--x,0),var(--y,0))}.eye.left{left:16px}.eye.right{right:16px}.mouth{position:absolute;left:27px;bottom:15px;width:18px;height:8px;border-bottom:2px solid #9c86ff;border-radius:50%}.intro{text-align:center}.intro h1{margin:0;font-size:22px}.intro p{margin:4px 0 18px;color:#8190a6}.field{display:grid;gap:6px;margin-top:11px}.field label{color:#aab5c5;font-size:11px}.input-wrap{display:flex;align-items:center;border:1px solid #2b3a51;border-radius:12px;background:#111827;transition:border-color .16s,box-shadow .16s}.input-wrap:focus-within{border-color:#6edff4;box-shadow:0 0 0 3px #4bdfff18}.input-wrap input{width:100%;padding:12px;border:0;outline:0;background:transparent;color:white}.peek{border:0;background:transparent;color:#8da0b9;cursor:pointer}.options{display:flex;justify-content:space-between;margin:12px 0 16px;color:#8d9caf;font-size:11px}.submit{position:relative;width:100%;min-height:44px;overflow:hidden;border:0;border-radius:12px;background:linear-gradient(110deg,#245cff,#5b9cff);color:white;font-weight:800;cursor:pointer}.submit span{display:inline-block}.submit.busy span{animation:exit .25s both}.submit.busy::after{content:"Проверяем…";position:absolute;inset:0;display:grid;place-items:center;animation:enter .25s both}@keyframes exit{to{transform:translateY(-14px);opacity:0}}@keyframes enter{from{transform:translateY(14px);opacity:0}}@media(prefers-reduced-motion:reduce){.submit.busy span,.submit.busy::after{animation:none}}
</style></head><body><form class="card" novalidate><div class="sentinel" aria-hidden="true"><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i></div><div class="intro"><h1>С возвращением</h1><p>Войдите в Eclipse Workspace</p></div><div class="field"><label for="email">Email</label><div class="input-wrap"><input id="email" type="email" autocomplete="email" placeholder="name@example.com" required></div></div><div class="field"><label for="password">Пароль</label><div class="input-wrap"><input id="password" type="password" autocomplete="current-password" required><button class="peek" type="button" aria-label="Показать пароль">◉</button></div></div><div class="options"><label><input type="checkbox"> Запомнить меня</label><a href="#">Забыли пароль?</a></div><button class="submit" type="submit"><span>Войти</span></button></form><script>
const p=new URLSearchParams(location.search),reduced=p.get('reduce')==='1'||matchMedia('(prefers-reduced-motion: reduce)').matches,eyes=[...document.querySelectorAll('.eye')],form=document.querySelector('form'),password=document.querySelector('#password');if(!reduced){addEventListener('pointermove',e=>{const r=form.getBoundingClientRect(),x=Math.max(-2,Math.min(2,(e.clientX-(r.left+r.width/2))/80)),y=Math.max(-2,Math.min(2,(e.clientY-(r.top+60))/80));eyes.forEach(eye=>{eye.style.setProperty('--x',`${x}px`);eye.style.setProperty('--y',`${y}px`)})})}password.addEventListener('focus',()=>eyes.forEach(eye=>eye.style.transform='scaleY(.35)'));password.addEventListener('blur',()=>eyes.forEach(eye=>eye.style.transform=''));document.querySelector('.peek').onclick=e=>{password.type=password.type==='password'?'text':'password';e.currentTarget.setAttribute('aria-label',password.type==='password'?'Показать пароль':'Скрыть пароль')};form.onsubmit=e=>{e.preventDefault();const btn=document.querySelector('.submit');btn.classList.add('busy');setTimeout(()=>btn.classList.remove('busy'),900)};
</script></body></html>
