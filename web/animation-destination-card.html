<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Destination Card — Eclipse Motion Lab</title><style>
/* Eclipse 3D contract: progressive content reveal; responsive viewport */
:root{--accent:#6ba3ff;--speed:1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090b11;color:#f8f5ef;font:500 14px/1.45 Inter,system-ui;display:grid;place-items:center;padding:18px}.scene{width:min(760px,100%);perspective:1100px}.card{position:relative;min-height:420px;border:1px solid #ffffff15;border-radius:34px;background:#11151d;box-shadow:0 35px 90px #0009;overflow:hidden;transform-style:preserve-3d;transition:transform calc(.45s/var(--speed)),box-shadow calc(.45s/var(--speed))}.card.open{transform:rotateX(1deg) translateY(-5px);box-shadow:0 48px 110px #000c}.visual{position:absolute;inset:8px;border-radius:27px;overflow:hidden;background:linear-gradient(155deg,#ef9f78 0 24%,#7e9d9b 25% 37%,#314739 38% 54%,#13241b 55%)}.visual:before{content:"";position:absolute;inset:22% -5% 0;background:linear-gradient(155deg,#657a73,#1b2d24 48%,#08100d);clip-path:polygon(0 48%,18% 17%,29% 40%,45% 2%,61% 39%,78% 14%,100% 45%,100% 100%,0 100%)}.visual:after{content:"";position:absolute;left:17%;right:17%;bottom:12%;height:20%;border-radius:50%;background:linear-gradient(90deg,#2d98a1,#74c5b9);filter:blur(1px);box-shadow:0 0 35px #55b8b766}.panel{position:absolute;z-index:2;right:8px;top:8px;bottom:8px;width:48%;padding:clamp(22px,4vw,38px);border-radius:27px;background:linear-gradient(110deg,#080b10d9,#151a22f5);backdrop-filter:blur(18px);display:flex;flex-direction:column;justify-content:center;transform:translateX(0);transition:width calc(.45s/var(--speed)),transform calc(.45s/var(--speed)),background calc(.45s/var(--speed))}.open .panel{width:60%;background:#0b0f16f2}.kicker{color:var(--accent);text-transform:uppercase;letter-spacing:.17em;font-size:10px}.panel h1{font-size:clamp(30px,6vw,54px);line-height:.95;margin:12px 0 4px}.panel h2{color:#9aa6b5;font-size:15px;font-weight:500;margin:0 0 20px}.summary{color:#c7cfda;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.open .summary{-webkit-line-clamp:5}.details{display:flex;gap:18px;margin:20px 0;color:#cbd3de}.details b{color:#fff}.actions{display:flex;gap:9px;margin-top:8px}.primary,.save{min-height:48px;border:0;border-radius:15px;font:750 13px inherit;cursor:pointer}.primary{flex:1;background:var(--accent);color:#07101d}.save{width:48px;background:#ffffff0d;color:#fff}.save[aria-pressed=true]{color:#ff93ad;background:#ff6f941c}.primary:focus-visible,.save:focus-visible{outline:2px solid #fff;outline-offset:3px}.hint{position:absolute;z-index:3;left:25px;bottom:24px;padding:9px 12px;border-radius:12px;background:#05080cb8;color:#d6e0ee;backdrop-filter:blur(12px);transition:opacity calc(.25s/var(--speed))}.open .hint{opacity:0}.reduce *{transition-duration:.001ms!important}@media(max-width:620px){.card{min-height:610px}.visual{bottom:46%;}.panel,.open .panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:58%;padding:24px}.open .panel{height:68%}.hint{top:24px;bottom:auto}}@media(prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}</style></head><body>
<main class="scene"><article class="card"><div class="visual" role="img" aria-label="Стилизованный горный пейзаж на закате"></div><div class="panel"><span class="kicker">Eclipse journeys</span><h1>Valhalla</h1><h2>Горный маршрут · Север</h2><p class="summary">Спокойный маршрут через озёра и хвойные долины. Карточка показывает главное сразу, а подробности раскрывает без перехода на новую страницу.</p><div class="details"><span><small>от</small><br><b>12 900 ₽</b></span><span><small>длительность</small><br><b>4 дня</b></span></div><div class="actions"><button class="primary" type="button" aria-expanded="false">Подробнее</button><button class="save" type="button" aria-pressed="false" aria-label="Сохранить">♡</button></div></div><span class="hint">Нажмите, чтобы раскрыть</span></article></main>
<style>@media(pointer:fine){.card:hover{transform:rotateX(1deg) translateY(-3px)}}</style>
<script>
const q=new URLSearchParams(location.search),card=document.querySelector('.card'),primary=document.querySelector('.primary'),save=document.querySelector('.save'),scene=document.querySelector('.scene');
function setOpen(on){card.classList.toggle('open',on);primary.setAttribute('aria-expanded',String(on));primary.textContent=on?'Скрыть детали':'Подробнее'}
primary.addEventListener('click',()=>setOpen(!card.classList.contains('open')));save.addEventListener('click',()=>{const on=save.getAttribute('aria-pressed')!=='true';save.setAttribute('aria-pressed',String(on));save.textContent=on?'♥':'♡';save.setAttribute('aria-label',on?'Удалить из сохранённых':'Сохранить')});
scene.style.setProperty('--accent',/^#[0-9a-f]{6}$/i.test(q.get('accent')||'')?q.get('accent'):'#6ba3ff');scene.style.setProperty('--speed',String(Math.max(.5,Number(q.get('speed'))||1)));if(q.get('reduce')==='1')scene.classList.add('reduce');if(q.get('state')==='open')setOpen(true);if(q.get('state')==='saved')save.click();window.__ready=true;
</script></body></html>
