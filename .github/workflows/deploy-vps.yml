name: Deploy library web to VPS (eclipse-forge.ru)

# Статический сайт library.eclipse-forge.ru. Канонические записи собираются из catalog/resources.json в web/.
# Секреты: VPS_SSH_KEY, VPS_KNOWN_HOSTS, VPS_HOST, VPS_USER, VPS_PATH (=/var/www/library).

on:
  workflow_run:
    workflows: ['Validate library catalog']
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      checks: read
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - name: Classify the complete source push without executing repository code
        id: scope
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            async function deploymentScope({github,context,bootstrapBase,bootstrapFiles}) {
              const event=context.eventName;
              const repo=context.repo;
              let before=context.payload.before;
              let after=context.sha;
              if(event==='workflow_dispatch') return true;
              if(event==='workflow_run') {
                const run=context.payload.workflow_run;
                if(run?.event!=='push'||run.conclusion!=='success'||run.head_repository?.full_name!==`${repo.owner}/${repo.repo}`) return false;
                if(!Number.isSafeInteger(run.check_suite_id)) throw Error('Missing source push check suite');
                const {data:suite}=await github.rest.checks.getSuite({...repo,check_suite_id:run.check_suite_id});
                if(suite.head_sha!==run.head_sha||suite.after!==run.head_sha||suite.head_branch!==run.head_branch) throw Error('Source push mismatch');
                before=suite.before; after=suite.after;
              } else if(event!=='push') return false;
              const valid=v=>typeof v==='string'&&/^[a-f0-9]{40}$/.test(v)&&!/^0+$/.test(v);
              if(!valid(before)||!valid(after)||before===after) throw Error('Unknown push range: deployment requires manual review');
              const {data:comparison}=await github.rest.repos.compareCommitsWithBasehead({...repo,basehead:`${before}...${after}`,per_page:100,page:1});
              // The Compare API returns at most 300 changed files, even with pagination.
              // Fail closed at that boundary instead of guessing that omitted files are documentation.
              if(comparison.status!=='ahead'||comparison.behind_by!==0||comparison.merge_base_commit?.sha!==before||!Array.isArray(comparison.files)||comparison.files.length===0||comparison.files.length>=300) throw Error('Incomplete change list: deployment requires manual review');
              const documentation=p=>p==='README.md'||p==='docs/repository-guide.md'||p==='docs/assets/repository-cover.svg'||p.startsWith('docs/assets/ui/')||p.startsWith('docs/portfolio/');
              const knownPath=p=>typeof p==='string'&&p.length>0&&!p.includes('..')&&!p.includes('\\')&&!p.startsWith('/');
              const ignored=p=>documentation(p)||(before===bootstrapBase&&bootstrapFiles.includes(p));
              for(const file of comparison.files){
                if(!knownPath(file.filename)||(file.previous_filename!==undefined&&!knownPath(file.previous_filename))) throw Error('Invalid changed path');
                // A rename from runtime into docs still changes runtime.
                if(!ignored(file.filename)||(file.previous_filename&&!ignored(file.previous_filename))) return true;
              }
              return false;
            }
            const required = await deploymentScope({ github, context, bootstrapBase: "591266f8979501a9635f8892d9a9601346114905", bootstrapFiles: ["README.md","docs/repository-guide.md","docs/assets/repository-cover.svg","docs/assets/ui/overview.png","docs/assets/ui/mobile.png","docs/assets/ui/capture.json",".github/workflows/deploy-vps.yml"] });
            core.setOutput('required', String(required));
            core.info(required ? 'Runtime changes: existing deployment gates remain in force.' : 'Presentation-only change: deployment is not required.');

  deploy:
    needs: ["deployment-scope"]
    if: >-
      needs.deployment-scope.outputs.required == 'true' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success'))
    concurrency:
      group: deploy-vps
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Validate static payload
        run: |
          node scripts/build-catalog-index.mjs --check
          node scripts/build-catalog-runtime.mjs --check
          node scripts/build-license-review-queue.mjs --check
          node scripts/build-catalog-exports.mjs --check
          node scripts/build-guides-manifest.mjs --check
          node scripts/validate-star-technology-registry.mjs
          node --test scripts/catalog-runtime-build.test.mjs
          node --test scripts/catalog-client-contract.test.mjs
          node scripts/library-navigation.test.mjs
          node --test scripts/diagram-contract.test.mjs
          node --test scripts/brand-assets.test.mjs
          node --test scripts/source-motion-library.test.mjs
          node --test scripts/original-motion-publication.test.mjs
          node scripts/original-motion-publication.mjs --check
          node --test scripts/gwen-reveal.test.mjs scripts/gwen-publication.test.mjs
          node scripts/gwen-publication.mjs --check
          node --test scripts/anura.test.mjs scripts/anura-publication.test.mjs
          node scripts/anura-publication.mjs --check
          node --check web/library-shell.js
          node --check web/catalog-review.js
          node --check web/registry.js
          node --check scripts/review-preview-policy.mjs
          node --check scripts/review-preview.mjs

      - name: Build static payload
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp -r guides _site/guides
          cp -r prompts _site/prompts
          rm -f _site/.gitignore _site/_*.png _site/_edge.log
          rm -f _site/experiments/gwen-reveal/README.md _site/experiments/gwen-reveal/design-qa.md
          node scripts/gwen-publication.mjs --check-stage _site
          node scripts/anura-publication.mjs --check-stage _site
          node scripts/original-motion-publication.mjs --check-stage _site

      - name: Setup SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_KNOWN_HOSTS"
          test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: Deploy via rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          for attempt in 1 2 3; do
            if rsync -avz --delete \
              -e "ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=12 -o ConnectionAttempts=2 -o ServerAliveInterval=10 -o ServerAliveCountMax=2" \
              _site/ "$VPS_USER@$VPS_HOST:$VPS_PATH/"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Deploy failed after 3 bounded attempts."
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Verify production payload
        env:
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          node scripts/smoke-production.mjs https://library.eclipse-forge.ru/
          node scripts/gwen-publication.mjs --smoke https://library.eclipse-forge.ru/
          node scripts/anura-publication.mjs --smoke https://library.eclipse-forge.ru/
          node scripts/original-motion-publication.mjs --smoke https://library.eclipse-forge.ru/
