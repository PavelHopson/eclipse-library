name: Validate library catalog

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - 'README.md'
      - 'catalog/**'
      - 'contracts/gwen-publication.json'
      - 'guides/**'
      - 'prompts/**'
      - 'web/**'
      - 'scripts/**'
      - '.github/workflows/quality.yml'
      - '.github/workflows/deploy-vps.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check web/catalog-runtime.js
          node --check web/catalog-card.js
          node --check web/catalog-editorial.js
          node --check web/catalog-progressive.js
          node --check web/catalog-review.js
          node --check web/app.js
          node --check web/library-shell.js
          node --check web/animation-lab.js
          node --check web/registry.js
          node --check web/experiments/gwen-reveal/script.js
          node --check scripts/review-preview-policy.mjs
          node --check scripts/review-preview.mjs
      - name: Validate structured catalog
        run: |
          node scripts/build-catalog-index.mjs --check
          node scripts/build-catalog-runtime.mjs --check
          node scripts/build-license-review-queue.mjs --check
          node scripts/build-catalog-exports.mjs --check
          node scripts/build-guides-manifest.mjs --check
          node scripts/validate-catalog-index.mjs
          node scripts/validate-catalog.mjs
          node --test scripts/catalog-runtime-build.test.mjs
          node --test scripts/catalog-client-contract.test.mjs
          node scripts/library-navigation.test.mjs
          node --test scripts/catalog-policy.test.mjs
          node --test scripts/catalog-progressive.test.mjs
          node --test scripts/diagram-contract.test.mjs
          node --test scripts/brand-assets.test.mjs
          node --test scripts/source-motion-library.test.mjs
          node --test scripts/gwen-reveal.test.mjs scripts/gwen-publication.test.mjs
          node scripts/gwen-publication.mjs --check
          node scripts/animation-lab.test.mjs
          node --test scripts/review-preview.test.mjs
      - name: Validate Eclipse Forge projects
        run: node scripts/validate-projects.mjs
      - name: Validate Eclipse technology registry
        run: node scripts/validate-star-technology-registry.mjs
      - name: Validate published link health
        run: node scripts/validate-link-health.mjs
      - name: Validate GitHub repository metadata
        run: |
          node --test scripts/github-metadata.test.mjs
          node scripts/validate-github-metadata.mjs
      - name: Validate production smoke contract
        run: node --test scripts/smoke-production.test.mjs
      - name: Validate MCP audit status
        run: |
          node --test scripts/mcp-metadata-policy.test.mjs
          node scripts/validate-mcp-audit.mjs
      - name: Prevent new catalog duplicates
        run: |
          node --test scripts/catalog-identity.test.mjs
          node scripts/catalog-identity.mjs
      - name: Audit catalog identity offline
        run: node scripts/check-links.mjs
