name: Validate library catalog

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - 'README.md'
      - 'web/**'
      - 'scripts/**'
      - '.github/workflows/quality.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: node --check web/app.js
      - name: Validate structured catalog
        run: node scripts/validate-catalog.mjs
      - name: Validate Eclipse Forge projects
        run: node scripts/validate-projects.mjs
      - name: Validate published link health
        run: node scripts/validate-link-health.mjs
      - name: Audit catalog identity offline
        run: node scripts/check-links.mjs
