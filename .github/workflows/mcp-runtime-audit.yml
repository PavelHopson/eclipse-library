name: Audit MCP runtime metadata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eclipse-library-mcp-runtime-audit
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Prepare empty scoped filesystem
        run: mkdir -p "$RUNNER_TEMP/eclipse-library-mcp-root"
      - name: Inspect pinned MCP tool metadata without calling tools
        env:
          MCP_FILESYSTEM_ROOT: ${{ runner.temp }}/eclipse-library-mcp-root
          MCP_AUDIT_OUTPUT: .artifacts/mcp-runtime
          npm_config_ignore_scripts: 'true'
          npm_config_audit: 'true'
        run: node scripts/runtime-scan-mcp.mjs
      - name: Upload private runtime evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: eclipse-library-mcp-runtime-audit
          path: .artifacts/mcp-runtime
          if-no-files-found: error
          retention-days: 7
